body{font-family:'Geist',system-ui,sans-serif;background:var(--ink9);color:var(--fg);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased}

input,textarea,select,button{font-family:'Geist',system-ui,sans-serif;outline:none}button{cursor:pointer}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}

@keyframes slideRight{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:translateX(0)}}
@keyframes slideLeft{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:translateX(0)}}
@keyframes progressFill{from{width:0}to{width:100%}}
@keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}
@keyframes agentGlow{0%,100%{box-shadow:0 0 0 0 rgba(155,109,255,.3)}60%{box-shadow:0 0 0 5px rgba(155,109,255,0)}}

.spin{animation:spin .7s linear infinite}
.pulse{animation:pulse 1.8s ease infinite}
.btn{display:inline-flex;align-items:center;gap:6px;border:none;border-radius:8px;padding:8px 14px;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap}

.phone-btn-r{position:absolute;right:-7px;top:76px;width:3px;height:40px;background:#181818;border-radius:0 2px 2px 0}

.phone-btn-l2{position:absolute;left:-7px;top:68px;width:3px;height:26px;background:#181818;border-radius:2px 0 0 2px}
.phone-btn-l3{position:absolute;left:-7px;top:100px;width:3px;height:26px;background:#181818;border-radius:2px 0 0 2px}

// UTILS
function fmtNum(n){if(!n)return'0';if(n>=1e6)return(n/1e6).toFixed(1)+'M';if(n>=1000)return(n/1000).toFixed(1)+'K';return n.toString()}
function fmtDate(iso){if(!iso)return'';try{return new Date(iso).toLocaleDateString('en-US',{month:'short',day:'numeric'})}catch{return''}}
function fmtTime(iso){if(!iso)return'';try{return new Date(iso).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}catch{return''}}
function fmtRelative(iso){if(!iso)return'';const d=Date.now()-new Date(iso).getTime();const m=Math.floor(d/60000);if(m<1)return'just now';if(m<60)return m+'m ago';const h=Math.floor(m/60);if(h<24)return h+'h ago';return Math.floor(h/24)+'d ago'}

// ATOMS
function Avatar({client,size=36}){return <div style={{width:size,height:size,borderRadius:size/4,background:client.color,display:'grid',placeItems:'center',fontWeight:700,fontSize:size*.32,color:'#fff',flexShrink:0}}>{client.initials}</div>}
function PlatTag({platform,size='sm'}){const p=PLAT[platform];if(!p)return null;return <span className={'tag '+p.cls}>{p.icon}{size!=='xs'&&' '+p.label}</span>}
function StatusTag({status}){const s=STATUS_META[status]||STATUS_META.draft;return <span className={'tag '+s.cls}>{s.label}</span>}
function Spinner({size=16}){return <div className="spin" style={{width:size,height:size,border:'2px solid var(--ink5)',borderTopColor:'var(--acc)',borderRadius:'50%'}}/>}
function Toast({msg,onClose}){useEffect(()=>{const t=setTimeout(onClose,3200);return()=>clearTimeout(t);},[]);return <div style={{position:'fixed',bottom:24,left:'50%',transform:'translateX(-50%)',zIndex:9999}} className="fadeUp"><div style={{background:'#252a36',border:'1px solid #3a4050',borderRadius:12,padding:'10px 18px',fontSize:12.5,color:'#f0ede8',display:'flex',alignItems:'center',gap:10,boxShadow:'0 8px 32px rgba(0,0,0,.5)'}}><span style={{color:'var(--grn)',fontSize:15}}>✓</span>{msg}<button onClick={onClose} style={{background:'none',border:'none',color:'var(--ink3)',fontSize:14,marginLeft:6,cursor:'pointer'}}>✕</button></div></div>}

              </div>

      </div>
    </div>
  );
}

// CONTENT CALENDAR
function ContentCalendar({posts,clients,onCompose,setSelectedPost}){
  const today=new Date();
  const [calYear,setCalYear]=useState(today.getFullYear());
  const [calMonth,setCalMonth]=useState(today.getMonth());
  const [calView,setCalView]=useState('month');
  const monthNames=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const dayNames=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  function buildMonth(y,m){const first=new Date(y,m,1).getDay();const days=new Date(y,m+1,0).getDate();const cells=[];for(let i=0;i<first;i++)cells.push(null);for(let d=1;d<=days;d++)cells.push(d);while(cells.length%7!==0)cells.push(null);return cells;}
  const cells=buildMonth(calYear,calMonth);
  const isToday=d=>d&&calYear===today.getFullYear()&&calMonth===today.getMonth()&&d===today.getDate();
  function prevMonth(){if(calMonth===0){setCalYear(y=>y-1);setCalMonth(11);}else setCalMonth(m=>m-1);}
  function nextMonth(){if(calMonth===11){setCalYear(y=>y+1);setCalMonth(0);}else setCalMonth(m=>m+1);}
  const weekStart=new Date(today);weekStart.setDate(today.getDate()-today.getDay());
  const weekDays=Array.from({length:7},(_,i)=>{const d=new Date(weekStart);d.setDate(weekStart.getDate()+i);return d;});
  function getDayPosts(y,m,d){return posts.filter(p=>{const pd=new Date(p.scheduledAt);return pd.getFullYear()===y&&pd.getMonth()===m&&pd.getDate()===d;});}
  const scheduled=posts.filter(p=>['scheduled','approved'].includes(p.status)).length;
  return(
    <div style={{padding:'24px 28px',overflowY:'auto',height:'100%'}} className="slideLeft">
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:20}}>
        <div>
          <h1 style={{fontFamily:"'Fraunces',Georgia,serif",fontSize:24,fontWeight:400,color:'var(--fg)',letterSpacing:'-.02em'}}>{monthNames[calMonth]} {calYear}</h1>
          <p style={{fontSize:12,color:'var(--ink3)',marginTop:2}}>{scheduled} scheduled · {posts.filter(p=>p.status==='pending_review').length} awaiting review</p>
        </div>
        <div style={{display:'flex',gap:8,alignItems:'center'}}>
          <div style={{display:'flex',background:'var(--ink7)',borderRadius:8,padding:3}}>
            {['month','week'].map(v=><button key={v} onClick={()=>setCalView(v)} style={{padding:'5px 14px',borderRadius:6,fontSize:12,fontWeight:500,border:'none',background:calView===v?'var(--acc)':'transparent',color:calView===v?'#fff':'var(--ink3)',cursor:'pointer',transition:'all .15s'}}>{v.charAt(0).toUpperCase()+v.slice(1)}</button>)}
          </div>
          <div style={{display:'flex',gap:4}}>
            <button onClick={prevMonth} className="btn btn-subtle" style={{padding:'7px 10px'}}>‹</button>
            <button onClick={()=>{setCalYear(today.getFullYear());setCalMonth(today.getMonth());}} className="btn btn-subtle" style={{padding:'7px 12px',fontSize:11.5}}>Today</button>
            <button onClick={nextMonth} className="btn btn-subtle" style={{padding:'7px 10px'}}>›</button>
          </div>
          <button onClick={()=>onCompose(null)} className="btn btn-acc">+ New Post</button>
        </div>
      </div>
      <div style={{display:'flex',gap:10,marginBottom:16,flexWrap:'wrap'}}>{clients.map(c=><div key={c.id} style={{display:'flex',alignItems:'center',gap:5,fontSize:11,color:'var(--ink2)'}}><div style={{width:8,height:8,borderRadius:2,background:c.color,flexShrink:0}}/>{c.name}</div>)}</div>
      <div style={{background:'var(--ink8)',border:'1px solid var(--ink7)',borderRadius:14,overflow:'hidden'}}>
        <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',borderBottom:'1px solid var(--ink7)'}}>
          {dayNames.map(d=><div key={d} style={{padding:'10px 0',textAlign:'center',fontSize:11,color:'var(--ink3)',fontWeight:600,letterSpacing:'.04em'}}>{d}</div>)}
        </div>
        {calView==='month'&&(
          <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)'}}>
            {cells.map((day,i)=>{
              const dayPosts=day?getDayPosts(calYear,calMonth,day):[];
              return(
                <div key={i} className="cal-cell" style={{borderRight:i%7!==6?'1px solid var(--ink7)':'none',borderBottom:i<cells.length-7?'1px solid var(--ink7)':'none',background:isToday(day)?'rgba(217,107,58,.06)':'transparent'}}>
                  {day&&<>
                    <div style={{fontSize:12,fontWeight:isToday(day)?700:400,color:isToday(day)?'var(--acc)':'var(--ink3)',marginBottom:4,display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                      <span>{day}</span>{isToday(day)&&<span style={{fontSize:8,background:'var(--acc)',color:'#fff',borderRadius:3,padding:'1px 4px',fontWeight:700}}>TODAY</span>}
                    </div>
                    {dayPosts.slice(0,3).map(p=>{const c=clients.find(cl=>cl.id===p.clientId);return <div key={p.id} onClick={()=>setSelectedPost(p)} className="cal-chip" style={{background:(c?.color||'#888')+'22',border:'1px solid '+(c?.color||'#888')+'44',color:c?.color}}>{PLAT[p.platform]?.icon} {c?.initials}</div>;})}
                    {dayPosts.length>3&&<div style={{fontSize:9,color:'var(--ink3)',marginTop:2}}>+{dayPosts.length-3} more</div>}
                  </>}
                </div>
              );
            })}
          </div>
        )}
        {calView==='week'&&(
          <div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',borderBottom:'1px solid var(--ink7)'}}>
              {weekDays.map((d,i)=>{const isT=d.getDate()===today.getDate()&&d.getMonth()===today.getMonth();return <div key={i} style={{padding:'14px 12px',borderRight:i<6?'1px solid var(--ink7)':'none',background:isT?'rgba(217,107,58,.06)':'transparent',textAlign:'center'}}><div style={{fontSize:10,color:'var(--ink3)',fontWeight:600,marginBottom:4}}>{dayNames[i]}</div><div style={{fontSize:20,fontWeight:700,color:isT?'var(--acc)':'var(--fg)'}}>{d.getDate()}</div></div>;})}
            </div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',minHeight:300}}>
              {weekDays.map((d,i)=>{
                const dayPosts=posts.filter(p=>{const pd=new Date(p.scheduledAt);return pd.getDate()===d.getDate()&&pd.getMonth()===d.getMonth();});
                return(
                  <div key={i} style={{padding:8,borderRight:i<6?'1px solid var(--ink7)':'none',display:'flex',flexDirection:'column',gap:6}}>
                    {dayPosts.map(p=>{const c=clients.find(cl=>cl.id===p.clientId);return <div key={p.id} onClick={()=>setSelectedPost(p)} style={{background:(c?.color||'#888')+'18',border:'1px solid '+(c?.color||'#888')+'33',borderRadius:8,padding:'8px 10px',cursor:'pointer',transition:'all .15s'}} onMouseOver={e=>e.currentTarget.style.opacity='.75'} onMouseOut={e=>e.currentTarget.style.opacity='1'}><div style={{fontSize:10,color:c?.color,fontWeight:600,marginBottom:3}}>{c?.name}</div><div style={{fontSize:10.5,color:'var(--ink1)',overflow:'hidden',textOverflow:'ellipsis',display:'-webkit-box',WebkitLineClamp:2,WebkitBoxOrient:'vertical',marginBottom:5,lineHeight:1.4}}>{p.caption}</div><div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}><PlatTag platform={p.platform} size="xs"/><StatusTag status={p.status}/></div></div>;})}
                  </div>
                );
              })}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

// APPROVALS
function ApprovalsQueue({posts,setPosts,clients,showToast,onEditPost}){
  const pending=posts.filter(p=>p.status==='pending_review');
  const [filter,setFilter]=useState('all');
  const filtered=filter==='all'?pending:pending.filter(p=>p.clientId===filter);
  function approve(id){setPosts(ps=>ps.map(p=>p.id===id?{...p,status:'approved'}:p));showToast('Post approved ✓');}
  function reject(id){setPosts(ps=>ps.map(p=>p.id===id?{...p,status:'draft'}:p));showToast('Sent back to draft');}
  return(

// CAMPAIGN BUILDER
function CampaignBuilder({clients,onPostsGenerated,showToast,onEditPost}){
  const [selClient,setSelClient]=useState(null);
  const [ctype,setCtype]=useState('launch');
  const [duration,setDuration]=useState('1w');
  const [brief,setBrief]=useState('');
  const [platforms,setPlatforms]=useState(['instagram','tiktok']);
  const [phase,setPhase]=useState('setup');
  const [agents,setAgents]=useState([]);
  const [genPosts,setGenPosts]=useState([]);

  const dur=DURATIONS.find(d=>d.id===duration)||DURATIONS[0];
  const ct=CAMPAIGN_TYPES.find(t=>t.id===ctype)||CAMPAIGN_TYPES[0];

  function togglePlat(p){setPlatforms(prev=>prev.includes(p)?prev.filter(x=>x!==p):[...prev,p]);}

  function buildPosts(client,count,plats){
    const pool=AI_RESPONSES[client.id]||AI_RESPONSES.c1;
    const days={
      '1w':7,'2w':14,'1m':30,'3m':90
    }[duration]||7;
    const out=[];
    const now=Date.now();
    for(let i=0;i<Math.min(count,18);i++){
      const daysOut=Math.max(1,Math.round((i/count)*days));
      const hour=9+(i%9);
      const scheduledAt=new Date(now+daysOut*86400000+hour*3600000).toISOString();
      const plat=plats[i%plats.length];
      const raw=pool[i%pool.length];
      const parts=raw.split('\n\n');
      const cap=parts[0].replace(/^"|"$/g,'').replace(/^Here.*?:\n\n/,'').replace(/^Try.*?:\n\n/,'').replace(/^For.*?:\n\n/,'');
      const tags=parts.find(p=>p.trim().startsWith('#'))||'#'+client.name.toLowerCase().replace(/\s+/g,'');
      out.push({id:'gen-'+Date.now()+'-'+i,clientId:client.id,platform:plat,caption:cap,hashtags:tags,status:'pending_review',scheduledAt,aiGenerated:true,campaign:ct.label});
    }
    return out;
  }

  function startGeneration(){
    if(!selClient){showToast('Select a client first');return;}
    if(!brief.trim()){showToast('Add a campaign brief');return;}
    if(!platforms.length){showToast('Select at least one platform');return;}
    setPhase('generating');
    const agentDefs=[
      {id:'research',label:'Research Agent',desc:'Reading '+selClient.name+"'s brand voice from Notion…",delay:0,dur:1600},
      {id:'ig',label:'Caption Agent — '+platforms.slice(0,2).map(p=>PLAT[p]?.short).join('/'),desc:'Writing '+Math.ceil(dur.posts*.5)+' brand-matched captions…',delay:1200,dur:2400},
      {id:'hashtag',label:'Hashtag Agent',desc:'Building platform-specific tag clusters…',delay:2800,dur:1600},
      {id:'schedule',label:'Scheduler Agent',desc:'Mapping optimal post times across '+dur.label+'…',delay:3800,dur:1200},
      {id:'review',label:'Review Agent',desc:'Consistency pass — voice, tone, arc…',delay:4600,dur:1400},
    ];
    setAgents(agentDefs.map(a=>({...a,status:'waiting'})));
    agentDefs.forEach(a=>{
      setTimeout(()=>setAgents(prev=>prev.map(ag=>ag.id===a.id?{...ag,status:'running'}:ag)),a.delay);
      setTimeout(()=>setAgents(prev=>prev.map(ag=>ag.id===a.id?{...ag,status:'done'}:ag)),a.delay+a.dur);
    });
    const total=Math.max(...agentDefs.map(a=>a.delay+a.dur))+700;
    setTimeout(()=>{
      const posts=buildPosts(selClient,dur.posts,platforms.length?platforms:['instagram']);
      setGenPosts(posts);setPhase('preview');
      showToast(posts.length+' posts generated — ready to review');
    },total);
  }

  function pushToApprovals(){
    onPostsGenerated(genPosts);
    showToast(genPosts.length+' posts added to Approvals queue');
    setPhase('setup');setBrief('');setGenPosts([]);setAgents([]);
  }

  return(
    <div style={{padding:'24px 28px',overflowY:'auto',height:'100%'}} className="slideLeft">
      <div style={{marginBottom:22}}>
        <h1 style={{fontFamily:"'Fraunces',Georgia,serif",fontSize:26,fontWeight:400,color:'var(--fg)',letterSpacing:'-.02em'}}>Campaign Builder</h1>
        <p style={{fontSize:12,color:'var(--ink3)',marginTop:4}}>Generate a full content campaign with AI agents — in seconds</p>
      </div>

      {phase==='setup'&&(
        <div style={{display:'grid',gridTemplateColumns:'1fr 300px',gap:20,alignItems:'start'}} className="fadeIn">
          <div style={{display:'flex',flexDirection:'column',gap:20}}>
            {/* Client */}
            <div>
              <label style={{fontSize:11,color:'var(--ink3)',fontWeight:600,textTransform:'uppercase',letterSpacing:'.07em',display:'block',marginBottom:10}}>Client</label>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
                {clients.map(c=>(
                  <button key={c.id} onClick={()=>setSelClient(c)} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 12px',borderRadius:10,border:'1.5px solid '+(selClient?.id===c.id?c.color:'var(--ink6)'),background:selClient?.id===c.id?c.color+'12':'transparent',cursor:'pointer',transition:'all .15s',textAlign:'left'}}>
                    <Avatar client={c} size={32}/>
                    <div><div style={{fontSize:13,fontWeight:600,color:'var(--fg)'}}>{c.name}</div><div style={{fontSize:10.5,color:'var(--ink3)'}}>{c.genre}</div></div>
                  </button>
                ))}
              </div>
            </div>
            {/* Campaign type */}
            <div>
              <label style={{fontSize:11,color:'var(--ink3)',fontWeight:600,textTransform:'uppercase',letterSpacing:'.07em',display:'block',marginBottom:10}}>Campaign Type</label>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
                {CAMPAIGN_TYPES.map(t=>(
                  <button key={t.id} onClick={()=>setCtype(t.id)} className={'ctype-btn'+(ctype===t.id?' on':'')}>
                    <div style={{fontSize:18,marginBottom:4}}>{t.icon}</div>
                    <div style={{fontSize:12.5,fontWeight:600,color:'var(--fg)',marginBottom:2}}>{t.label}</div>
                    <div style={{fontSize:11,color:'var(--ink3)'}}>{t.desc}</div>
                  </button>
                ))}
              </div>
            </div>
            {/* Duration */}
            <div>
              <label style={{fontSize:11,color:'var(--ink3)',fontWeight:600,textTransform:'uppercase',letterSpacing:'.07em',display:'block',marginBottom:10}}>Duration</label>
              <div style={{display:'flex',gap:8,marginBottom:14}}>
                {DURATIONS.map(d=><button key={d.id} onClick={()=>setDuration(d.id)} className={'dur-pill'+(duration===d.id?' on':'')}>{d.label}</button>)}
              </div>
              <div style={{background:'var(--ink7)',borderRadius:10,padding:'12px 14px'}}>
                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8}}>
                  <span style={{fontSize:12,color:'var(--ink2)',fontWeight:500}}>Content volume</span>
                  <span style={{fontSize:13,fontWeight:700,color:'var(--fg)'}}>{dur.posts} posts</span>
                </div>
                <div style={{height:6,borderRadius:3,background:'var(--ink5)',overflow:'hidden'}}>
                  <div style={{height:'100%',borderRadius:3,background:'linear-gradient(90deg,var(--grn),'+(dur.effort>.6?'var(--amb)':'var(--grn)')+')',width:(dur.effort*100)+'%',transition:'width .4s cubic-bezier(.22,1,.36,1)'}}/>
                </div>
                <div style={{display:'flex',justifyContent:'space-between',marginTop:6,fontSize:10.5,color:'var(--ink3)'}}><span>Low effort</span><span>High effort</span></div>
              </div>
            </div>
            {/* Platforms */}
            <div>
              <label style={{fontSize:11,color:'var(--ink3)',fontWeight:600,textTransform:'uppercase',letterSpacing:'.07em',display:'block',marginBottom:10}}>Platforms</label>
              <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
                {(selClient?selClient.platforms:Object.keys(PLAT)).map(p=>{
                  const on=platforms.includes(p);const pl=PLAT[p];
                  return <button key={p} onClick={()=>togglePlat(p)} style={{padding:'6px 12px',borderRadius:20,fontSize:12,fontWeight:600,border:'1px solid '+(on?pl.color:'var(--ink6)'),background:on?pl.color+'18':'transparent',color:on?pl.color:'var(--ink3)',cursor:'pointer',transition:'all .15s'}}>{pl.icon} {pl.label}</button>;
                })}
              </div>
            </div>
            {/* Brief */}
            <div>
              <label style={{fontSize:11,color:'var(--ink3)',fontWeight:600,textTransform:'uppercase',letterSpacing:'.07em',display:'block',marginBottom:8}}>Campaign Brief</label>
              <textarea value={brief} onChange={e=>setBrief(e.target.value)} className="input" placeholder={'What\'s this campaign about?\n\ne.g. "Ethiopia Yirgacheffe launch — 5-day rollout, focus on origin story and limited stock urgency. Stone fruit notes, bright acidity. Build toward Friday drop."'} style={{width:'100%',minHeight:110,resize:'vertical',lineHeight:1.65,fontSize:13}}/>
              <div style={{fontSize:11,color:'var(--ink3)',marginTop:6}}>The AI reads this brief + {selClient?.name||"your client"}'s brand voice to generate the campaign.</div>
            </div>
            <div>
              <button onClick={startGeneration} className="btn btn-acc" style={{padding:'11px 24px',fontSize:13}}>
                <span style={{fontSize:14}}>✦</span> Generate Campaign
              </button>
            </div>
          </div>

          {/* Summary card */}
          <div style={{position:'sticky',top:0}}>
            <div style={{background:'var(--ink8)',border:'1px solid var(--ink7)',borderRadius:16,padding:20}}>
              <div style={{fontSize:11,fontWeight:600,color:'var(--ink3)',textTransform:'uppercase',letterSpacing:'.07em',marginBottom:14}}>Campaign Summary</div>
              {selClient?(
                <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:14,paddingBottom:14,borderBottom:'1px solid var(--ink7)'}}><Avatar client={selClient} size={36}/><div><div style={{fontSize:14,fontWeight:600,color:'var(--fg)'}}>{selClient.name}</div><div style={{fontSize:11,color:'var(--ink3)'}}>{selClient.genre}</div></div></div>
              ):(
                <div style={{fontSize:12,color:'var(--ink4)',marginBottom:14,paddingBottom:14,borderBottom:'1px solid var(--ink7)',fontStyle:'italic'}}>No client selected yet</div>
              )}
              {[{label:'Type',value:ct.label},{label:'Duration',value:dur.label},{label:'Total Posts',value:dur.posts},{label:'Platforms',value:platforms.length?platforms.map(p=>PLAT[p]?.short).join(', '):'—'}].map((r,i)=>(
                <div key={i} style={{display:'flex',alignItems:'center',justifyContent:'space-between',fontSize:12.5,marginBottom:10}}>
                  <span style={{color:'var(--ink3)'}}>{r.label}</span>
                  <span style={{color:'var(--fg)',fontWeight:600}}>{r.value||'—'}</span>
                </div>
              ))}
              {brief&&<div style={{marginTop:12,paddingTop:12,borderTop:'1px solid var(--ink7)'}}><div style={{fontSize:10.5,color:'var(--ink3)',fontWeight:600,marginBottom:5}}>Brief</div><div style={{fontSize:11.5,color:'var(--ink1)',lineHeight:1.6,display:'-webkit-box',WebkitLineClamp:4,WebkitBoxOrient:'vertical',overflow:'hidden'}}>{brief}</div></div>}
            </div>
          </div>
        </div>
      )}

      {phase==='generating'&&(
        <div style={{maxWidth:560,margin:'0 auto',paddingTop:20}} className="fadeIn">
          <div style={{textAlign:'center',marginBottom:32}}>
            <div style={{fontSize:18,fontWeight:600,color:'var(--fg)',marginBottom:6}}>Agents are building your campaign</div>
            <div style={{fontSize:13,color:'var(--ink3)'}}>{dur.posts} posts for {selClient?.name} · {dur.label} {ct.label} campaign</div>
          </div>
          <div style={{display:'flex',flexDirection:'column',gap:10}}>
            {agents.map(a=>(
              <div key={a.id} className={'agent-row'+(a.status==='running'?' running':a.status==='done'?' done':'')}>
                <div style={{width:36,height:36,borderRadius:10,background:a.status==='waiting'?'var(--ink6)':a.status==='running'?'rgba(155,109,255,.15)':'rgba(34,197,139,.1)',border:'1px solid '+(a.status==='waiting'?'var(--ink5)':a.status==='running'?'rgba(155,109,255,.35)':'rgba(34,197,139,.3)'),display:'grid',placeItems:'center',flexShrink:0,transition:'all .4s'}}>
                  {a.status==='done'?<span style={{color:'var(--grn)',fontSize:16}}>✓</span>:a.status==='running'?<Spinner size={14}/>:<span style={{fontSize:12,color:'var(--ink4)'}}>○</span>}
                </div>
                <div style={{flex:1}}>
                  <div style={{fontSize:13,fontWeight:600,color:a.status==='waiting'?'var(--ink3)':'var(--fg)',transition:'color .3s'}}>{a.label}</div>
                  <div style={{fontSize:11.5,color:'var(--ink3)',marginTop:2}}>{a.desc}</div>
                </div>
                {a.status==='running'&&<div style={{width:64,height:3,borderRadius:2,background:'var(--ink5)',overflow:'hidden',flexShrink:0}}><div style={{height:'100%',background:'var(--pur)',borderRadius:2,animation:'progressFill 2.4s ease forwards'}}/></div>}
                {a.status==='done'&&<span style={{fontSize:11,color:'var(--grn)',fontWeight:600,flexShrink:0}}>Done</span>}
              </div>
            ))}
          </div>
        </div>
      )}

      {phase==='preview'&&(
        <div className="fadeIn">
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:20}}>
            <div>
              <div style={{fontSize:16,fontWeight:600,color:'var(--fg)'}}>{genPosts.length} posts generated for {selClient?.name}</div>
              <div style={{fontSize:12,color:'var(--ink3)',marginTop:2}}>Click any post to edit — then push the batch to Approvals</div>
            </div>
            <div style={{display:'flex',gap:8}}>
              <button onClick={()=>{setPhase('setup');setGenPosts([]);setAgents([]);}} className="btn btn-ghost">← Regenerate</button>
              <button onClick={pushToApprovals} className="btn btn-acc">Push to Approvals ({genPosts.length})</button>
            </div>
          </div>
          <div style={{display:'flex',flexDirection:'column',gap:8}}>
            {genPosts.map((p,i)=>{
              const c=clients.find(cl=>cl.id===p.clientId);
              if(!c)return null;
              return(
                <div key={p.id} onClick={()=>onEditPost(p)} style={{background:'var(--ink8)',border:'1px solid var(--ink7)',borderRadius:12,padding:'14px 16px',display:'flex',alignItems:'flex-start',gap:12,cursor:'pointer',transition:'all .15s'}} onMouseOver={e=>e.currentTarget.style.borderColor='var(--acc)'} onMouseOut={e=>e.currentTarget.style.borderColor='var(--ink7)'}>
                  <div style={{width:28,height:28,borderRadius:7,background:'var(--ink6)',display:'grid',placeItems:'center',fontSize:11,fontWeight:700,color:'var(--ink3)',flexShrink:0}}>{i+1}</div>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{display:'flex',gap:6,alignItems:'center',marginBottom:6,flexWrap:'wrap'}}>
                      <PlatTag platform={p.platform}/><StatusTag status={p.status}/><span className="tag" style={{color:'var(--pur)',background:'rgba(155,109,255,.13)'}}>✦ AI</span>
                      <span style={{marginLeft:'auto',fontSize:11,color:'var(--ink3)'}}>{fmtDate(p.scheduledAt)} · {fmtTime(p.scheduledAt)}</span>
                    </div>
                    <div style={{fontSize:12.5,color:'var(--ink1)',lineHeight:1.6,display:'-webkit-box',WebkitLineClamp:2,WebkitBoxOrient:'vertical',overflow:'hidden'}}>{p.caption}</div>
                    <div style={{fontSize:11,color:'var(--ink3)',marginTop:4}}>{p.hashtags}</div>
                  </div>
                  <div style={{fontSize:11,color:'var(--acc)',fontWeight:600,flexShrink:0,marginTop:4}}>Edit ↗</div>
                </div>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
}


// POST COMPOSER (for New Post button)
function PostComposer({open,onClose,clients,initialClient,onSave,showToast}){
  const [client,setClient]=useState(initialClient||null);
  const [platforms,setPlatforms]=useState(['instagram']);
  const [caption,setCaption]=useState('');
  const [hashtags,setHashtags]=useState('');
  const [scheduleAt,setScheduleAt]=useState('');
  const [aiLoading,setAiLoading]=useState(false);
  const [aiVariants,setAiVariants]=useState([]);
  const [previewPlat,setPreviewPlat]=useState('instagram');
  const [saving,setSaving]=useState('');
  useEffect(()=>{if(open&&initialClient)setClient(initialClient);},[open,initialClient]);
  useEffect(()=>{if(open){setCaption('');setHashtags('');setAiVariants([]);setPlatforms(['instagram']);setSaving('');}},[open]);
  function togglePlat(p){setPlatforms(prev=>prev.includes(p)?prev.filter(x=>x!==p):[...prev,p]);}
  async function generateAI(){
    if(!client)return showToast('Select a client first');
    setAiLoading(true);setAiVariants([]);
    await new Promise(r=>setTimeout(r,1600));
    setAiVariants(AI_RESPONSES[client.id]||AI_RESPONSES.c1);
    setAiLoading(false);
  }
  function applyVariant(v){
    const parts=v.split('\n\n');const tags=parts.find(p=>p.startsWith('#'));
    setCaption(parts[0].replace(/^"|"$/g,'').replace(/^(Here.*?|Try.*?|For.*?):\n\n/,''));
    if(tags)setHashtags(tags);showToast('Caption applied');
  }
  function handleSave(status){
    if(!client)return showToast('Select a client first');
    if(!caption.trim())return showToast('Caption is empty');
    setSaving(status);
    setTimeout(()=>{
      onSave({id:'p'+Date.now(),clientId:client.id,platform:platforms[0]||'instagram',caption,hashtags,status,scheduledAt:scheduleAt||new Date(Date.now()+86400000).toISOString(),aiGenerated:aiVariants.length>0});
      setSaving('');onClose();showToast(status==='pending_review'?'Submitted for review':'Draft saved');
    },900);
  }
  if(!open)return null;
  const charLimit=PLAT[previewPlat]?.limit||2200;
  const charCount=caption.length+(hashtags?hashtags.length+2:0);
  const charPct=Math.min(1,charCount/charLimit);
  const charColor=charPct>.9?'var(--red)':charPct>.7?'var(--amb)':'var(--grn)';
  return(
    <div style={{position:'fixed',inset:0,zIndex:200,display:'flex',alignItems:'stretch',justifyContent:'flex-end'}} className="fadeIn">
      <div style={{position:'absolute',inset:0,background:'rgba(0,0,0,.6)',backdropFilter:'blur(4px)'}} onClick={onClose}/>
      <div style={{position:'relative',width:760,background:'var(--ink8)',borderLeft:'1px solid var(--ink7)',display:'flex',flexDirection:'column',height:'100%',overflowY:'auto'}} className="slideRight">
        <div style={{padding:'18px 22px',borderBottom:'1px solid var(--ink7)',display:'flex',alignItems:'center',gap:12,flexShrink:0}}>
          <div style={{flex:1}}><div style={{fontFamily:"'Fraunces',Georgia,serif",fontSize:18,fontWeight:400,color:'var(--fg)'}}>New Post</div><div style={{fontSize:11,color:'var(--ink3)',marginTop:2}}>Create and schedule content</div></div>
          <button onClick={onClose} style={{background:'var(--ink7)',border:'none',color:'var(--ink2)',borderRadius:8,width:32,height:32,display:'grid',placeItems:'center',cursor:'pointer',fontSize:16}}>✕</button>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 260px',flex:1,overflow:'hidden'}}>
          <div style={{padding:'20px 22px',overflowY:'auto',display:'flex',flexDirection:'column',gap:18,borderRight:'1px solid var(--ink7)'}}>
            <div>
              <label style={{fontSize:11,color:'var(--ink3)',fontWeight:600,textTransform:'uppercase',letterSpacing:'.07em',display:'block',marginBottom:8}}>Client</label>
              <div style={{display:'grid',gridTemplateColumns:'repeat(2,1fr)',gap:6}}>
                {clients.map(c=><button key={c.id} onClick={()=>setClient(c)} style={{display:'flex',alignItems:'center',gap:8,padding:'8px 10px',borderRadius:9,border:'1px solid '+(client?.id===c.id?c.color:'var(--ink6)'),background:client?.id===c.id?c.color+'14':'transparent',cursor:'pointer',transition:'all .15s',textAlign:'left'}}><div style={{width:24,height:24,borderRadius:6,background:c.color,display:'grid',placeItems:'center',fontSize:9,fontWeight:700,color:'#fff',flexShrink:0}}>{c.initials}</div><div><div style={{fontSize:12,fontWeight:600,color:'var(--fg)',lineHeight:1.2}}>{c.name}</div><div style={{fontSize:10,color:'var(--ink3)'}}>{c.genre}</div></div></button>)}
              </div>
            </div>
            <div>
              <label style={{fontSize:11,color:'var(--ink3)',fontWeight:600,textTransform:'uppercase',letterSpacing:'.07em',display:'block',marginBottom:8}}>Platforms</label>
              <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
                {(client?client.platforms:Object.keys(PLAT)).map(p=>{const on=platforms.includes(p);const pl=PLAT[p];return <button key={p} onClick={()=>togglePlat(p)} style={{padding:'6px 12px',borderRadius:20,fontSize:12,fontWeight:600,border:'1px solid '+(on?pl.color:'var(--ink6)'),background:on?pl.color+'18':'transparent',color:on?pl.color:'var(--ink3)',cursor:'pointer',transition:'all .15s'}}>{pl.icon} {pl.label}</button>;})}
              </div>
            </div>
            <div>
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8}}>
                <label style={{fontSize:11,color:'var(--ink3)',fontWeight:600,textTransform:'uppercase',letterSpacing:'.07em'}}>Caption</label>
                <span style={{fontSize:10.5,color:charColor,fontWeight:600}}>{charCount}/{charLimit}</span>
              </div>
              <textarea value={caption} onChange={e=>setCaption(e.target.value)} className="input" placeholder="Write your caption…" style={{width:'100%',minHeight:130,resize:'vertical',lineHeight:1.65,fontSize:13}}/>
              <div style={{height:2,borderRadius:2,background:'var(--ink6)',marginTop:6}}><div style={{height:'100%',borderRadius:2,background:charColor,width:(charPct*100)+'%',transition:'width .2s'}}/></div>
            </div>
            <div>
              <label style={{fontSize:11,color:'var(--ink3)',fontWeight:600,textTransform:'uppercase',letterSpacing:'.07em',display:'block',marginBottom:8}}>Hashtags</label>
              <textarea value={hashtags} onChange={e=>setHashtags(e.target.value)} className="input" placeholder="#hashtag1 #hashtag2…" style={{width:'100%',minHeight:60,resize:'vertical',fontSize:12.5,lineHeight:1.6}}/>
            </div>
            <div style={{background:'var(--ink7)',borderRadius:12,padding:14}}>
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:aiVariants.length?12:0}}>
                <div><div style={{fontSize:12.5,fontWeight:600,color:'var(--fg)',display:'flex',alignItems:'center',gap:6}}><span style={{color:'var(--pur)'}}>✦</span> AI Generator</div><div style={{fontSize:11,color:'var(--ink3)',marginTop:2}}>{client?.name||'Your client'}'s voice</div></div>
                <button onClick={generateAI} className="btn" style={{background:'linear-gradient(135deg,var(--pur),#6b3fd4)',color:'#fff',border:'none',flexShrink:0}} disabled={aiLoading}>{aiLoading?<><Spinner size={12}/> Generating…</>:'Generate ✦'}</button>
              </div>
              {aiVariants.length>0&&<div style={{display:'flex',flexDirection:'column',gap:8}} className="fadeUp">{aiVariants.map((v,i)=><div key={i} style={{background:'var(--ink8)',borderRadius:9,padding:'10px 12px',border:'1px solid var(--ink6)',cursor:'pointer',transition:'all .15s'}} onClick={()=>applyVariant(v)} onMouseOver={e=>e.currentTarget.style.borderColor='var(--pur)'} onMouseOut={e=>e.currentTarget.style.borderColor='var(--ink6)'}><div style={{fontSize:11.5,color:'var(--ink1)',lineHeight:1.55,marginBottom:6,whiteSpace:'pre-wrap',display:'-webkit-box',WebkitLineClamp:3,WebkitBoxOrient:'vertical',overflow:'hidden'}}>{v}</div><div style={{fontSize:10,color:'var(--pur)',fontWeight:600}}>Click to apply →</div></div>)}</div>}
            </div>
            <div>
              <label style={{fontSize:11,color:'var(--ink3)',fontWeight:600,textTransform:'uppercase',letterSpacing:'.07em',display:'block',marginBottom:8}}>Schedule</label>
              <input type="datetime-local" value={scheduleAt} onChange={e=>setScheduleAt(e.target.value)} className="input" style={{width:'100%',colorScheme:'dark'}}/>
            </div>
            <div style={{display:'flex',gap:8,paddingTop:4}}>
              <button onClick={()=>handleSave('draft')} className="btn btn-ghost" disabled={!!saving}>{saving==='draft'?<><Spinner size={12}/> Saving…</>:'Save Draft'}</button>
              <button onClick={()=>handleSave('pending_review')} className="btn btn-acc" style={{flex:1,justifyContent:'center'}} disabled={!!saving}>{saving==='pending_review'?<><Spinner size={12}/> Submitting…</>:'Submit for Review'}</button>
            </div>
          </div>
          <div style={{padding:'20px 16px',overflowY:'auto',background:'var(--ink9)',display:'flex',flexDirection:'column',gap:12}}>
            <div>
              <label style={{fontSize:10.5,color:'var(--ink3)',fontWeight:600,textTransform:'uppercase',letterSpacing:'.07em',display:'block',marginBottom:8}}>Preview</label>
              <div style={{display:'flex',gap:4,flexWrap:'wrap'}}>{platforms.map(p=><button key={p} onClick={()=>setPreviewPlat(p)} style={{padding:'4px 10px',borderRadius:12,fontSize:11,fontWeight:600,border:'1px solid '+(previewPlat===p?PLAT[p].color:'var(--ink6)'),background:previewPlat===p?PLAT[p].color+'18':'transparent',color:previewPlat===p?PLAT[p].color:'var(--ink3)',cursor:'pointer'}}>{PLAT[p].icon}</button>)}</div>
            </div>
            <div style={{background:'#000',borderRadius:20,overflow:'hidden',border:'2px solid var(--ink6)',aspectRatio:'9/16',maxHeight:420,display:'flex',flexDirection:'column'}}>
              <div style={{padding:'10px 12px',display:'flex',alignItems:'center',gap:8,background:'#111'}}>{client&&<div style={{width:26,height:26,borderRadius:'50%',background:client.color,display:'grid',placeItems:'center',fontSize:9,fontWeight:700,color:'#fff'}}>{client.initials}</div>}<div><div style={{fontSize:11,fontWeight:600,color:'#fff'}}>{client?.handles?.[previewPlat]||'@handle'}</div><div style={{fontSize:9,color:'#888'}}>{previewPlat}</div></div><span style={{marginLeft:'auto',color:'#888',fontSize:16}}>···</span></div>
              <div style={{flex:1,background:client?'linear-gradient(135deg,'+client.color+'44,'+client.color+'11,#000)':'var(--ink7)',display:'flex',alignItems:'center',justifyContent:'center'}}>{client?<div style={{width:64,height:64,borderRadius:'50%',background:client.color,display:'grid',placeItems:'center',fontSize:20,fontWeight:700,color:'#fff',opacity:.7}}>{client.initials}</div>:<span style={{color:'var(--ink5)',fontSize:12}}>Select a client</span>}</div>
              <div style={{padding:'8px 12px',background:'#111'}}><div style={{fontSize:10,color:'#fff',lineHeight:1.5,display:'-webkit-box',WebkitLineClamp:2,WebkitBoxOrient:'vertical',overflow:'hidden'}}>{caption||<span style={{color:'#555'}}>Caption…</span>}</div>{hashtags&&<div style={{fontSize:9,color:'#4d9fff',marginTop:3}}>{hashtags}</div>}</div>
            </div>
            <div style={{fontSize:11,color:charColor,textAlign:'center',fontWeight:600}}>{charLimit-charCount} characters remaining</div>
          </div>
        </div>
      </div>
    </div>
  );
}

// ONBOARDING WIZARD
function OnboardingWizard({open,onClose,onComplete,showToast}){
  const [step,setStep]=useState(0);
  const [name,setName]=useState('');
  const [genre,setGenre]=useState('');
  const [handles,setHandles]=useState({instagram:'',tiktok:''});
  const [driveConnected,setDriveConnected]=useState(false);
  const [driveLoading,setDriveLoading]=useState(false);
  const [scraping,setScraping]=useState(false);
  const [scrapeProgress,setScrapeProgress]=useState(0);
  const [scraped,setScraped]=useState([]);
  function connectDrive(){setDriveLoading(true);setTimeout(()=>{setDriveLoading(false);setDriveConnected(true);showToast('Google Drive connected');},1800);}
  function startScrape(){
    setScraping(true);setScrapeProgress(0);
    const iv=setInterval(()=>setScrapeProgress(p=>{if(p>=100){clearInterval(iv);setScraping(false);setScraped([{platform:'instagram',caption:'Latest content from the account',likes:1240,type:'image'},{platform:'tiktok',caption:'Trending video content',likes:5600,type:'video'}]);return 100;}return p+2;}),64);
  }
  function complete(){
    const initials=name.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
    const colors=['#d96b3a','#9b6dff','#f5a623','#22c58b','#4d9fff','#f25c5c'];
    const color=colors[Math.floor(Math.random()*colors.length)];
    onComplete({id:'c'+Date.now(),name,genre,initials,color,handles,platforms:Object.keys(handles).filter(k=>handles[k]),postsThisWeek:0,pendingApproval:0,lastSynced:new Date().toISOString(),bio:'',brandVoice:'',targetAudience:'',dos:[],donts:[],brandColors:[color],followers:{instagram:'0',tiktok:'0'}});
    onClose();showToast(name+' added to your roster!');
  }
  if(!open)return null;
  const steps=['Client Info','Google Drive','Scrape Content','Review'];
  const canNext=[name.trim()&&genre.trim(),driveConnected,scrapeProgress===100,true];
  return(
    <div style={{position:'fixed',inset:0,zIndex:300,display:'flex',alignItems:'center',justifyContent:'center',padding:24}} className="fadeIn">
      <div style={{position:'absolute',inset:0,background:'rgba(0,0,0,.75)',backdropFilter:'blur(6px)'}} onClick={onClose}/>
      <div style={{position:'relative',width:'100%',maxWidth:560,background:'var(--ink8)',border:'1px solid var(--ink7)',borderRadius:20,overflow:'hidden',boxShadow:'0 24px 80px rgba(0,0,0,.6)'}} className="scaleIn">
        <div style={{padding:'20px 24px',borderBottom:'1px solid var(--ink7)'}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:14}}>
            <div style={{fontFamily:"'Fraunces',Georgia,serif",fontSize:18,fontWeight:400,color:'var(--fg)'}}>Add New Client</div>
            <button onClick={onClose} style={{background:'none',border:'none',color:'var(--ink3)',fontSize:20,cursor:'pointer',lineHeight:1}}>✕</button>
          </div>
          <div style={{display:'flex',gap:0,alignItems:'center'}}>
            {steps.map((s,i)=>(
              <React.Fragment key={i}>
                <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:4}}>
                  <div style={{width:28,height:28,borderRadius:'50%',background:i<step?'var(--grn)':i===step?'var(--acc)':'var(--ink6)',display:'grid',placeItems:'center',fontSize:11,fontWeight:700,color:i<=step?'#fff':'var(--ink3)',transition:'all .3s'}}>{i<step?'✓':i+1}</div>
                  <div style={{fontSize:9.5,color:i===step?'var(--fg)':'var(--ink3)',fontWeight:i===step?600:400,whiteSpace:'nowrap'}}>{s}</div>
                </div>
                {i<steps.length-1&&<div style={{flex:1,height:1,background:i<step?'var(--grn)':'var(--ink6)',margin:'0 6px 14px',transition:'background .4s'}}/>}
              </React.Fragment>
            ))}
          </div>
        </div>
        <div style={{padding:24,minHeight:260}}>
          {step===0&&<div style={{display:'flex',flexDirection:'column',gap:14}} className="fadeIn">
            <div><label style={{fontSize:11,color:'var(--ink3)',fontWeight:600,textTransform:'uppercase',letterSpacing:'.07em',display:'block',marginBottom:6}}>Client Name *</label><input value={name} onChange={e=>setName(e.target.value)} className="input" style={{width:'100%'}} placeholder="e.g. Maya Soleil"/></div>
            <div><label style={{fontSize:11,color:'var(--ink3)',fontWeight:600,textTransform:'uppercase',letterSpacing:'.07em',display:'block',marginBottom:6}}>Genre / Category *</label><input value={genre} onChange={e=>setGenre(e.target.value)} className="input" style={{width:'100%'}} placeholder="e.g. R&B / Soul, Food & Beverage…"/></div>
            <div style={{background:'var(--ink7)',borderRadius:10,padding:12,fontSize:12,color:'var(--ink2)',lineHeight:1.6}}>✦ We'll auto-create a Notion page and Google Drive folder for <strong style={{color:'var(--fg)'}}>{name||'this client'}</strong> after setup.</div>
          </div>}
          {step===1&&<div style={{display:'flex',flexDirection:'column',gap:14,alignItems:'center',textAlign:'center',paddingTop:10}} className="fadeIn">
            <div style={{width:60,height:60,borderRadius:16,background:'rgba(77,159,255,.12)',border:'1px solid rgba(77,159,255,.25)',display:'grid',placeItems:'center',fontSize:28}}>📁</div>
            <div><div style={{fontSize:15,fontWeight:600,color:'var(--fg)',marginBottom:6}}>Connect Google Drive</div><div style={{fontSize:12,color:'var(--ink2)',lineHeight:1.6}}>We'll create a shared folder for <strong style={{color:'var(--fg)'}}>{name||'this client'}</strong> inside your agency's Drive.</div></div>
            {!driveConnected?<button onClick={connectDrive} className="btn" style={{background:'#4f87f5',color:'#fff',border:'none',padding:'10px 24px',fontSize:13}} disabled={driveLoading}>{driveLoading?<><Spinner size={13}/> Connecting…</>:'🔐 Connect Google Drive'}</button>:<div style={{background:'rgba(34,197,139,.1)',border:'1px solid rgba(34,197,139,.25)',borderRadius:10,padding:'10px 18px',fontSize:13,color:'var(--grn)',display:'flex',alignItems:'center',gap:8}} className="scaleIn">✓ Drive connected — folder created</div>}
          </div>}
          {step===2&&<div style={{display:'flex',flexDirection:'column',gap:14}} className="fadeIn">
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
              <div><label style={{fontSize:11,color:'var(--ink3)',fontWeight:600,textTransform:'uppercase',letterSpacing:'.07em',display:'block',marginBottom:6}}>Instagram</label><input value={handles.instagram} onChange={e=>setHandles(h=>({...h,instagram:e.target.value}))} className="input" style={{width:'100%'}} placeholder="@handle"/></div>
              <div><label style={{fontSize:11,color:'var(--ink3)',fontWeight:600,textTransform:'uppercase',letterSpacing:'.07em',display:'block',marginBottom:6}}>TikTok</label><input value={handles.tiktok} onChange={e=>setHandles(h=>({...h,tiktok:e.target.value}))} className="input" style={{width:'100%'}} placeholder="@handle"/></div>
            </div>
            {!scraping&&scrapeProgress===0&&<button onClick={startScrape} className="btn btn-acc" style={{alignSelf:'flex-start'}}>Scrape Last 36 Posts</button>}
            {(scraping||scrapeProgress>0)&&<div style={{background:'var(--ink7)',borderRadius:10,padding:14}} className="fadeIn">
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8}}><div style={{fontSize:12,fontWeight:600,color:'var(--fg)'}}>{scrapeProgress<100?'Scraping posts…':'Scrape complete!'}</div><div style={{fontSize:11,color:'var(--ink3)'}}>{Math.round(scrapeProgress)}%</div></div>
              <div style={{height:4,borderRadius:2,background:'var(--ink6)',overflow:'hidden'}}><div style={{height:'100%',borderRadius:2,background:'var(--acc)',width:scrapeProgress+'%',transition:'width .1s linear'}}/></div>
              {scrapeProgress===100&&scraped.length>0&&<div style={{marginTop:10,display:'flex',flexDirection:'column',gap:5}} className="fadeIn">{scraped.slice(0,3).map((p,i)=><div key={i} style={{display:'flex',alignItems:'center',gap:8,fontSize:11,color:'var(--ink1)'}}><span style={{color:'var(--grn)'}}>✓</span>{p.caption} <PlatTag platform={p.platform} size="xs"/></div>)}<div style={{fontSize:11,color:'var(--grn)',marginTop:4}}>+ {36-scraped.length} more posts imported</div></div>}
            </div>}
          </div>}
          {step===3&&<div style={{display:'flex',flexDirection:'column',gap:10}} className="fadeIn">
            <div style={{fontSize:13,color:'var(--ink2)',marginBottom:6}}>Here's what will be created for <strong style={{color:'var(--fg)'}}>{name}</strong>:</div>
            {[{icon:'📋',label:'Notion page with brand profile'},{icon:'📁',label:'Google Drive folder for assets'},{icon:'📷',label:(scrapeProgress===100?36:0)+' scraped posts imported'},{icon:'🗄️',label:'Supabase record created'}].map((item,i)=><div key={i} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 12px',background:'var(--ink7)',borderRadius:9,fontSize:12.5,color:'var(--ink1)'}}><span style={{fontSize:16}}>{item.icon}</span>{item.label}</div>)}
          </div>}
        </div>
        <div style={{padding:'16px 24px',borderTop:'1px solid var(--ink7)',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
          <button onClick={()=>step>0?setStep(s=>s-1):onClose()} className="btn btn-ghost">{step===0?'Cancel':'← Back'}</button>
          <button onClick={()=>step<steps.length-1?setStep(s=>s+1):complete()} className="btn btn-acc" disabled={!canNext[step]} style={{opacity:canNext[step]?1:.4}}>{step===steps.length-1?'Add Client':'Next →'}</button>
        </div>
      </div>
    </div>
  );
}


// APP
function App(){
  const [view,setView]=useState('roster');
  const [posts,setPosts]=useState(POSTS_INIT);
  const [clients,setClients]=useState(CLIENTS);
  const [activeClientId,setActiveClientId]=useState(null);
  const [selectedPost,setSelectedPost]=useState(null);
  const [showComposer,setShowComposer]=useState(false);
  const [composerClient,setComposerClient]=useState(null);
  const [showOnboarding,setShowOnboarding]=useState(false);
  const [editPost,setEditPost]=useState(null);
  const [toast,setToast]=useState(null);

  const showToast=useCallback(msg=>setToast(msg),[]);
  const activeClient=clients.find(c=>c.id===activeClientId)||null;

  function openComposer(client){setComposerClient(client||null);setShowComposer(true);}
  function handleAddClient(nc){setClients(cs=>[...cs,nc]);}
  function handleSavePost(post){setPosts(ps=>[...ps,post]);}
  function handleSaveEdit(updated){setPosts(ps=>ps.map(p=>p.id===updated.id?updated:p));}
  function handleEditPost(post){setEditPost(post);}
  function handlePostsGenerated(newPosts){setPosts(ps=>[...ps,...newPosts]);}

  const editClient=editPost?clients.find(c=>c.id===editPost.clientId):null;

  function mainContent(){
    if(view==='client'&&activeClientId){
      const client=clients.find(c=>c.id===activeClientId);
      if(client)return <ClientDetail key={activeClientId} client={client} posts={posts} onBack={()=>setView('roster')} onCompose={openComposer} showToast={showToast}/>;
    }
    if(view==='roster'||view==='client')return <ClientRoster clients={clients} posts={posts} onSelect={c=>{setActiveClientId(c.id);setView('client');}} onAddClient={()=>setShowOnboarding(true)}/>;
    if(view==='campaign')return <CampaignBuilder clients={clients} onPostsGenerated={handlePostsGenerated} showToast={showToast} onEditPost={handleEditPost}/>;
    if(view==='calendar')return <ContentCalendar posts={posts} clients={clients} onCompose={openComposer} setSelectedPost={p=>setSelectedPost(p)}/>;
    if(view==='approvals')return <ApprovalsQueue posts={posts} setPosts={setPosts} clients={clients} showToast={showToast} onEditPost={handleEditPost}/>;
    if(view==='analytics')return <Analytics posts={posts} clients={clients}/>;
    if(view==='compose'){openComposer(null);setView('roster');return <ClientRoster clients={clients} posts={posts} onSelect={c=>{setActiveClientId(c.id);setView('client');}} onAddClient={()=>setShowOnboarding(true)}/>;}
    return null;
  }

  return(
    <div style={{display:'flex',height:'100vh',overflow:'hidden',background:'var(--ink9)'}}>
      <Sidebar view={view} setView={v=>{setView(v);if(v!=='client')setActiveClientId(null);}} activeClientId={activeClientId} setActiveClient={id=>{setActiveClientId(id);setView('client');}} clients={clients} posts={posts} onAddClient={()=>setShowOnboarding(true)}/>
      <main style={{flex:1,overflow:'hidden',display:'flex',flexDirection:'column'}}>{mainContent()}</main>
      <RightPanel activeClient={activeClient||composerClient} selectedPost={selectedPost} setSelectedPost={setSelectedPost} posts={posts} setPosts={setPosts} showToast={showToast} view={view}/>

      <PostComposer open={showComposer} onClose={()=>setShowComposer(false)} clients={clients} initialClient={composerClient} onSave={handleSavePost} showToast={showToast}/>
      <OnboardingWizard open={showOnboarding} onClose={()=>setShowOnboarding(false)} onComplete={handleAddClient} showToast={showToast}/>

      {editPost&&editClient&&(
        <PostEditorModal
          post={editPost}
          client={editClient}
          onClose={()=>setEditPost(null)}
          onSave={updated=>{handleSaveEdit(updated);setEditPost(null);}}
          showToast={showToast}
        />
      )}

      {toast&&<Toast msg={toast} onClose={()=>setToast(null)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
