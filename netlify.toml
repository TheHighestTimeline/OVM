[build]
  command         = "npm run build"
  publish         = "dist"
  functions       = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# SPA fallback — serve index.html for all non-asset paths
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Scheduled reminder function — runs every 5 minutes
[functions."scheduled-reminders"]
  schedule = "*/5 * * * *"
