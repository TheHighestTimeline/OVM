*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink9:#0e1014;--ink8:#161922;--ink7:#1f232e;--ink6:#252a36;--ink5:#3a4050;
  --ink3:#6b7180;--ink2:#a6abb8;--ink1:#d1d5db;--fg:#f0ede8;
  --acc:#d96b3a;--accD:#a04b22;--accS:#f5e2d3;
  --grn:#22c58b;--red:#f25c5c;--amb:#f5a623;--pur:#9b6dff;--blu:#4d9fff;
  --r6:6px;--r8:8px;--r10:10px;--r12:12px;--r14:14px;--r16:16px;
}
html,body{height:100%;overflow:hidden}
body{font-family:'Geist',system-ui,sans-serif;background:var(--ink9);color:var(--fg);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--ink5);border-radius:4px}
input,textarea,select{font-family:'Geist',system-ui,sans-serif;outline:none}
button{cursor:pointer;font-family:'Geist',system-ui,sans-serif}

@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes scaleIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
@keyframes slideRight{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:translateX(0)}}
@keyframes slideLeft{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:translateX(0)}}
@keyframes progressFill{from{width:0}to{width:100%}}
@keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

.fadeUp{animation:fadeUp .22s cubic-bezier(.22,1,.36,1) both}
.fadeIn{animation:fadeIn .18s ease both}
.scaleIn{animation:scaleIn .2s cubic-bezier(.22,1,.36,1) both}
.slideRight{animation:slideRight .22s cubic-bezier(.22,1,.36,1) both}
.slideLeft{animation:slideLeft .22s cubic-bezier(.22,1,.36,1) both}
.spin{animation:spin .7s linear infinite}
.pulse{animation:pulse 1.8s ease infinite}
.blink{animation:blink 1s step-end infinite}

.skeleton{background:linear-gradient(90deg,var(--ink7) 25%,var(--ink6) 50%,var(--ink7) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite}

.btn{display:inline-flex;align-items:center;gap:6px;border:none;border-radius:var(--r8);padding:8px 14px;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn-acc{background:var(--acc);color:#fff}.btn-acc:hover{background:var(--accD)}
.btn-ghost{background:transparent;color:var(--ink2);border:1px solid var(--ink5)}.btn-ghost:hover{color:var(--fg);border-color:var(--ink3)}
.btn-subtle{background:var(--ink7);color:var(--ink1)}.btn-subtle:hover{background:var(--ink6);color:var(--fg)}
.btn-grn{background:rgba(34,197,139,.15);color:var(--grn);border:1px solid rgba(34,197,139,.25)}.btn-grn:hover{background:rgba(34,197,139,.25)}
.btn-red{background:rgba(242,92,92,.12);color:var(--red);border:1px solid rgba(242,92,92,.25)}.btn-red:hover{background:rgba(242,92,92,.22)}

.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:500;padding:2px 8px;border-radius:20px;white-space:nowrap}
.input{background:var(--ink7);border:1px solid var(--ink5);border-radius:var(--r8);padding:8px 12px;color:var(--fg);font-size:13px;transition:border-color .15s}
.input:focus{border-color:var(--acc)}
.card{background:var(--ink8);border:1px solid var(--ink7);border-radius:var(--r14)}
.card:hover{border-color:var(--ink5)}
.surface{background:var(--ink7);border-radius:var(--r10)}

.plat-ig{color:#e1306c;background:#e1306c18}
.plat-tt{color:#69c9d0;background:#69c9d018}
.plat-fb{color:#4f87f5;background:#4f87f518}
.plat-yt{color:#ff4444;background:#ff444418}
.plat-th{color:#9ca3af;background:#9ca3af18}

.status-draft{color:#6b7180;background:rgba(107,113,128,.14)}
.status-review{color:var(--amb);background:rgba(245,166,35,.13)}
.status-approved{color:var(--blu);background:rgba(77,159,255,.13)}
.status-scheduled{color:var(--pur);background:rgba(155,109,255,.13)}
.status-posted{color:var(--grn);background:rgba(34,197,139,.13)}
.status-failed{color:var(--red);background:rgba(242,92,92,.13)}

/* Nav */
.nav-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 12px;border:none;border-radius:var(--r8);font-size:12.5px;font-weight:500;color:var(--ink3);background:transparent;transition:all .12s;cursor:pointer}
.nav-item:hover{color:var(--ink1);background:var(--ink7)}
.nav-item.active{color:var(--fg);background:var(--ink7)}
.nav-item.active .nav-icon{color:var(--acc)}

/* Right panel */
.rpanel{width:320px;flex-shrink:0;border-left:1px solid var(--ink7);display:flex;flex-direction:column;background:var(--ink8);overflow:hidden}

/* Calendar */
.cal-cell{min-height:88px;padding:5px;border-right:1px solid var(--ink7);border-bottom:1px solid var(--ink7);transition:background .1s}
.cal-cell:hover{background:var(--ink7)}
.cal-cell:nth-child(7n){border-right:none}
.cal-chip{font-size:9.5px;font-weight:500;padding:2px 5px;border-radius:4px;margin-bottom:2px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:opacity .1s}
.cal-chip:hover{opacity:.75}

/* Chat */
.chat-bubble-ai{background:var(--ink7);border-radius:12px 12px 12px 3px;padding:10px 13px;font-size:12.5px;color:var(--ink1);line-height:1.6;max-width:100%}
.chat-bubble-user{background:var(--acc);border-radius:12px 12px 3px 12px;padding:10px 13px;font-size:12.5px;color:#fff;line-height:1.6;max-width:85%;margin-left:auto}
.chat-input{background:var(--ink7);border:1px solid var(--ink5);border-radius:20px;padding:9px 14px;color:var(--fg);font-size:13px;width:100%;resize:none}
.chat-input:focus{border-color:var(--acc)}

/* Composer */
.plat-toggle{padding:6px 12px;border-radius:20px;font-size:11.5px;font-weight:600;border:1px solid var(--ink5);background:transparent;color:var(--ink3);cursor:pointer;transition:all .15s}
.plat-toggle.on{border-color:currentColor;background:currentColor}
.plat-toggle.on span{color:#fff!important}

/* Scrubber bar */
.progress-bar-anim{animation:progressFill 3.2s cubic-bezier(.4,0,.2,1) forwards}
</style>

// ═══ UTILS ══════════════════════════════════════════════════════════
function fmtNum(n){if(!n)return'0';if(n>=1000000)return(n/1000000).toFixed(1)+'M';if(n>=1000)return(n/1000).toFixed(1)+'K';return n.toString()}
function fmtDate(iso){if(!iso)return'';try{return new Date(iso).toLocaleDateString('en-US',{month:'short',day:'numeric'})}catch{return''}}
function fmtTime(iso){if(!iso)return'';try{return new Date(iso).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}catch{return''}}
function fmtRelative(iso){if(!iso)return'';const d=Date.now()-new Date(iso).getTime();const m=Math.floor(d/60000);if(m<1)return'just now';if(m<60)return`${m}m ago`;const h=Math.floor(m/60);if(h<24)return`${h}h ago`;return`${Math.floor(h/24)}d ago`}
function getClient(id){return CLIENTS.find(c=>c.id===id)}

function PlatTag({platform,size='sm'}){

}

function RightPanel({activeClient,selectedPost,setSelectedPost,posts,setPosts,showToast,view}){
  const [messages,setMessages]=useState(()=>activeClient?[...(AI_CONVOS[activeClient.id]||AI_CONVOS.default)]:AI_CONVOS.default);
  const [input,setInput]=useState('');
  const [typing,setTyping]=useState(false);
  const bottomRef=useRef(null);
  const inputRef=useRef(null);

  useEffect(()=>{
    setMessages(activeClient?[...(AI_CONVOS[activeClient.id]||AI_CONVOS.default)]:AI_CONVOS.default);
  },[activeClient?.id]);

  useEffect(()=>{
    bottomRef.current?.scrollIntoView({behavior:'smooth'});
  },[messages,typing]);

  function send(text){
    const msg=text||input.trim();
    if(!msg)return;
    setInput('');
    setMessages(m=>[...m,{role:'user',text:msg}]);
    setTyping(true);
    const delay=800+Math.random()*700;
    setTimeout(()=>{
      const pool=activeClient?AI_RESPONSES[activeClient.id]||AI_RESPONSES.c1:['Select a client first to get brand-specific caption suggestions. Each client has a unique voice I\'ve been trained on.'];
      const reply=pool[Math.floor(Math.random()*pool.length)];
      setTyping(false);
      setMessages(m=>[...m,{role:'ai',text:reply}]);
    },delay);
  }

  function handleKeyDown(e){
    if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}
  }

    `Write a caption for ${PLAT['instagram'].label}`,
    `Suggest 3 hashtag sets`,

              <div style={{fontSize:12,color:'var(--ink1)',lineHeight:1.6,marginBottom:6}}>{selectedPost.caption}</div>
              <div style={{fontSize:11,color:'var(--ink3)',marginBottom:10}}>{selectedPost.hashtags}</div>
              {selectedPost.status==='pending_review'&&(
                <div style={{display:'flex',gap:6}}>
                  <button className="btn btn-grn" style={{flex:1,justifyContent:'center'}} onClick={()=>{
                    setPosts(ps=>ps.map(p=>p.id===selectedPost.id?{...p,status:'approved'}:p));
                    setSelectedPost(null);showToast('Post approved ✓');
                  }}>Approve</button>
                  <button className="btn btn-red" style={{flex:1,justifyContent:'center'}} onClick={()=>{
                    setPosts(ps=>ps.map(p=>p.id===selectedPost.id?{...p,status:'draft'}:p));
                    setSelectedPost(null);showToast('Sent back to draft');
                  }}>Reject</button>
                </div>
              )}
            </div>
          </div>
        );
      })()}

      {/* Chat messages */}
      <div style={{flex:1,overflowY:'auto',padding:'14px 14px 8px',display:'flex',flexDirection:'column',gap:10}}>
        {messages.map((m,i)=>(
          <div key={i} style={{display:'flex',flexDirection:'column',alignItems:m.role==='user'?'flex-end':'flex-start'}} className="fadeIn">
            {m.role==='ai'&&(
              <div style={{display:'flex',alignItems:'flex-start',gap:7,maxWidth:'100%'}}>
                <div style={{width:20,height:20,borderRadius:5,background:'linear-gradient(135deg,var(--pur),#6b3fd4)',display:'grid',placeItems:'center',flexShrink:0,marginTop:2}}>
                  <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M1 7.5L3 4l2 2 2-4 1.5 2.5" stroke="white" strokeWidth="1.3" strokeLinecap="round" strokeLinejoin="round"/></svg>
                </div>
                <div className="chat-bubble-ai" style={{whiteSpace:'pre-wrap'}}>{m.text}</div>
              </div>
            )}
            {m.role==='user'&&<div className="chat-bubble-user">{m.text}</div>}
          </div>
        ))}
        {typing&&(
          <div style={{display:'flex',alignItems:'flex-start',gap:7}} className="fadeIn">
            <div style={{width:20,height:20,borderRadius:5,background:'linear-gradient(135deg,var(--pur),#6b3fd4)',display:'grid',placeItems:'center',flexShrink:0}}>
              <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M1 7.5L3 4l2 2 2-4 1.5 2.5" stroke="white" strokeWidth="1.3" strokeLinecap="round" strokeLinejoin="round"/></svg>
            </div>
            <div className="chat-bubble-ai" style={{display:'flex',gap:4,alignItems:'center',padding:'12px 14px'}}>
              {[0,1,2].map(i=><div key={i} style={{width:5,height:5,borderRadius:'50%',background:'var(--ink3)',animation:`pulse 1.2s ease ${i*.2}s infinite`}}/>)}
            </div>
          </div>
        )}
        <div ref={bottomRef}/>
      </div>

      {/* Suggestions */}
      <div style={{padding:'0 10px 8px',display:'flex',gap:4,flexWrap:'wrap'}}>
        {suggestBtns.map((s,i)=>(
          <button key={i} onClick={()=>send(s)} style={{fontSize:10.5,padding:'4px 9px',borderRadius:20,background:'var(--ink7)',border:'1px solid var(--ink6)',color:'var(--ink2)',cursor:'pointer',transition:'all .1s'}} onMouseOver={e=>{e.currentTarget.style.borderColor='var(--ink3)';e.currentTarget.style.color='var(--fg)'}} onMouseOut={e=>{e.currentTarget.style.borderColor='var(--ink6)';e.currentTarget.style.color='var(--ink2)'}}>
            {s}
          </button>
        ))}
      </div>

      {/* Input */}
      <div style={{padding:'0 12px 14px',flexShrink:0}}>
        <div style={{position:'relative'}}>
          <textarea ref={inputRef} value={input} onChange={e=>setInput(e.target.value)} onKeyDown={handleKeyDown} placeholder="Ask AI or generate a caption…" rows={1} className="chat-input" style={{paddingRight:40,minHeight:40,maxHeight:100,overflowY:'auto',resize:'none'}}/>
          <button onClick={()=>send()} style={{position:'absolute',right:10,bottom:10,background:input.trim()?'var(--acc)':'var(--ink6)',border:'none',borderRadius:6,width:24,height:24,display:'grid',placeItems:'center',cursor:'pointer',transition:'background .15s'}}>
            <svg width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M1 5.5h9M6.5 2L10 5.5 6.5 9" stroke="white" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
          </button>
        </div>
      </div>
    </div>
  );
}

// ═══ CLIENT ROSTER ════════════════════════════════════════════════
function ClientRoster({clients,posts,onSelect,onAddClient}){
  const [search,setSearch]=useState('');
  const filtered=clients.filter(c=>c.name.toLowerCase().includes(search.toLowerCase())||c.genre.toLowerCase().includes(search.toLowerCase()));
  const totalPending=posts.filter(p=>p.status==='pending_review').length;

  return(
    <div style={{padding:'28px 32px',overflowY:'auto',height:'100%'}} className="slideLeft">
      {/* Header */}
      <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',marginBottom:24}}>
        <div>
          <h1 style={{fontFamily:"'Fraunces',Georgia,serif",fontSize:26,fontWeight:400,color:'var(--fg)',letterSpacing:'-.02em',lineHeight:1.2}}>Client Roster</h1>
          <p style={{fontSize:12,color:'var(--ink3)',marginTop:4}}>{clients.length} clients · <span style={{color:'var(--amb)'}}>{totalPending} pending approval</span></p>
        </div>
        <div style={{display:'flex',gap:8,alignItems:'center'}}>
          <div style={{position:'relative'}}>
            <svg style={{position:'absolute',left:10,top:'50%',transform:'translateY(-50%)',color:'var(--ink3)',pointerEvents:'none'}} width="13" height="13" viewBox="0 0 13 13" fill="none"><circle cx="5.5" cy="5.5" r="4" stroke="currentColor" strokeWidth="1.3"/><path d="M9 9l2.5 2.5" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round"/></svg>
            <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search clients…" className="input" style={{paddingLeft:30,width:200,height:36,fontSize:12}}/>
          </div>
          <button onClick={onAddClient} className="btn btn-acc">
            <svg width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M5.5 1v9M1 5.5h9" stroke="white" strokeWidth="1.8" strokeLinecap="round"/></svg>
            Add Client
          </button>
        </div>
      </div>

      {/* Stats bar */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:12,marginBottom:28}}>
        {[
          {label:'Total Posts This Week',value:clients.reduce((a,c)=>a+c.postsThisWeek,0),color:'var(--fg)'},
          {label:'Pending Approval',value:totalPending,color:'var(--amb)'},
          {label:'Scheduled',value:posts.filter(p=>p.status==='scheduled').length,color:'var(--pur)'},
          {label:'Posted This Week',value:posts.filter(p=>p.status==='posted').length,color:'var(--grn)'},
        ].map((s,i)=>(
          <div key={i} style={{background:'var(--ink8)',border:'1px solid var(--ink7)',borderRadius:12,padding:'14px 16px'}}>
            <div style={{fontSize:22,fontWeight:700,color:s.color,fontFamily:"'Geist',sans-serif",letterSpacing:'-.02em'}}>{s.value}</div>
            <div style={{fontSize:11,color:'var(--ink3)',marginTop:3}}>{s.label}</div>
          </div>
        ))}
      </div>

      {/* Client grid */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(290px,1fr))',gap:14}}>
        {filtered.map(c=>{
          const pending=posts.filter(p=>p.clientId===c.id&&p.status==='pending_review').length;
          const clientPosts=posts.filter(p=>p.clientId===c.id);
          return(
            <div key={c.id} onClick={()=>onSelect(c)} style={{background:'var(--ink8)',border:'1px solid var(--ink7)',borderRadius:14,padding:20,cursor:'pointer',transition:'all .18s',position:'relative',overflow:'hidden'}}
              onMouseOver={e=>{e.currentTarget.style.borderColor='var(--ink5)';e.currentTarget.style.transform='translateY(-1px)';e.currentTarget.style.boxShadow='0 8px 24px rgba(0,0,0,.3)'}}
              onMouseOut={e=>{e.currentTarget.style.borderColor='var(--ink7)';e.currentTarget.style.transform='translateY(0)';e.currentTarget.style.boxShadow='none'}}>
              {/* Color accent bar */}
              <div style={{position:'absolute',top:0,left:0,right:0,height:3,borderRadius:'14px 14px 0 0',background:c.color,opacity:.7}}/>
              <div style={{display:'flex',alignItems:'flex-start',gap:12,marginBottom:14}}>
                <Avatar client={c} size={44}/>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:15,fontWeight:600,color:'var(--fg)',marginBottom:2,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{c.name}</div>
                  <div style={{fontSize:11.5,color:'var(--ink3)'}}>{c.genre}</div>
                </div>
                {pending>0&&<span style={{background:'rgba(245,166,35,.15)',color:'var(--amb)',fontSize:10.5,fontWeight:600,padding:'3px 8px',borderRadius:20,flexShrink:0,border:'1px solid rgba(245,166,35,.25)'}}>{pending} pending</span>}
              </div>
              {/* Platform tags */}
              <div style={{display:'flex',gap:5,flexWrap:'wrap',marginBottom:14}}>
                {c.platforms.map(p=><PlatTag key={p} platform={p} size="xs"/>)}
              </div>
              {/* Followers */}
              <div style={{display:'flex',gap:12,marginBottom:12}}>
                {Object.entries(c.followers).map(([plat,count])=>(
                  <div key={plat} style={{fontSize:11,color:'var(--ink2)'}}>
                    <span style={{color:PLAT[plat]?.color}}>{PLAT[plat]?.icon}</span> <span style={{fontWeight:600}}>{count}</span>
                  </div>
                ))}
              </div>
              {/* Footer */}
              <div style={{borderTop:'1px solid var(--ink7)',paddingTop:12,display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                <div style={{fontSize:11.5}}>
                  <span style={{color:'var(--ink3)'}}>This week </span>
                  <span style={{fontWeight:600,color:'var(--fg)'}}>{c.postsThisWeek} posts</span>
                </div>
                {/* Mini status bar */}
                <div style={{display:'flex',gap:3}}>
                  {['posted','scheduled','pending_review','draft'].map(st=>{
                    const n=clientPosts.filter(p=>p.status===st).length;
                    if(!n)return null;
                    const color=st==='posted'?'var(--grn)':st==='scheduled'?'var(--pur)':st==='pending_review'?'var(--amb)':'var(--ink5)';
                    return <div key={st} style={{width:n*6,height:4,borderRadius:2,background:color,maxWidth:24}} title={`${n} ${st}`}/>;
                  })}
                </div>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ═══ CLIENT DETAIL ════════════════════════════════════════════════
function ClientDetail({client,posts,onBack,onCompose,showToast,setActiveClient}){
  const[tab,setTab]=useState('brand');
  const[platFilter,setPlatFilter]=useState('all');
  const[editVoice,setEditVoice]=useState(client.brandVoice);
  const[editAudience,setEditAudience]=useState(client.targetAudience);
  const[voiceSaved,setVoiceSaved]=useState(false);
  const[selectedAsset,setSelectedAsset]=useState(null);
  const[activeFolder,setActiveFolder]=useState(null);

  const scraped=SCRAPED[client.id]||[];
  const assets=ASSETS[client.id]||[];
  const myPosts=posts.filter(p=>p.clientId===client.id);
  const filtered=platFilter==='all'?scraped:scraped.filter(p=>p.platform===platFilter);
  const folders=[...new Set(assets.map(a=>a.folder))];
  const folder=activeFolder||folders[0];
  const folderAssets=assets.filter(a=>a.folder===folder);

  function saveVoice(){setVoiceSaved(true);showToast('Brand voice saved to Notion');setTimeout(()=>setVoiceSaved(false),2200);}

  return(
    <div style={{display:'flex',flexDirection:'column',height:'100%',overflow:'hidden'}} className="slideLeft">
      {/* Header */}
      <div style={{background:'var(--ink8)',borderBottom:'1px solid var(--ink7)',padding:'14px 24px',display:'flex',alignItems:'center',gap:12,flexShrink:0}}>
        <button onClick={onBack} style={{background:'var(--ink7)',border:'none',color:'var(--ink2)',borderRadius:8,padding:'6px 11px',fontSize:12,cursor:'pointer',display:'flex',alignItems:'center',gap:5}} onMouseOver={e=>e.currentTarget.style.color='var(--fg)'} onMouseOut={e=>e.currentTarget.style.color='var(--ink2)'}>
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M7.5 2L3 6l4.5 4" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
          Roster
        </button>
        <Avatar client={client} size={36}/>
        <div style={{flex:1}}>
          <div style={{fontSize:15,fontWeight:600,color:'var(--fg)'}}>{client.name}</div>
          <div style={{fontSize:11,color:'var(--ink3)'}}>{client.genre} · {client.platforms.map(p=>PLAT[p]?.icon).join(' ')}</div>
        </div>
        {/* Post stats chips */}
        <div style={{display:'flex',gap:6}}>
          {[{n:myPosts.filter(p=>p.status==='pending_review').length,label:'In Review',c:'var(--amb)'},{n:myPosts.filter(p=>p.status==='scheduled').length,label:'Scheduled',c:'var(--pur)'},{n:myPosts.filter(p=>p.status==='posted').length,label:'Posted',c:'var(--grn)'}].filter(x=>x.n>0).map((x,i)=>(
            <span key={i} style={{fontSize:11,fontWeight:600,color:x.c,background:x.c+'18',border:`1px solid ${x.c}28`,borderRadius:20,padding:'3px 10px'}}>{x.n} {x.label}</span>
          ))}
        </div>
        <button onClick={()=>onCompose(client)} className="btn btn-acc">+ New Post</button>
      </div>
      {/* Tabs */}
      <div style={{borderBottom:'1px solid var(--ink7)',padding:'0 24px',background:'var(--ink8)',display:'flex',gap:0,flexShrink:0}}>
        {[{id:'brand',label:'Brand Profile'},{id:'content',label:`Content (${scraped.length})`},{id:'assets',label:`Drive Assets (${assets.length})`},{id:'posts',label:`Posts (${myPosts.length})`}].map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)} style={{padding:'12px 18px',fontSize:12.5,fontWeight:500,border:'none',borderBottom:`2px solid ${tab===t.id?'var(--acc)':'transparent'}`,color:tab===t.id?'var(--fg)':'var(--ink3)',background:'transparent',cursor:'pointer',transition:'all .15s'}}>
            {t.label}
          </button>
        ))}
      </div>
      {/* Tab content */}
      <div style={{flex:1,overflowY:'auto',padding:24}}>

        {tab==='brand'&&(
          <div style={{maxWidth:680,display:'flex',flexDirection:'column',gap:20}} className="fadeIn">
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
              {/* Bio */}
              <div style={{gridColumn:'1/-1'}}>
                <label style={{fontSize:10.5,color:'var(--ink3)',textTransform:'uppercase',letterSpacing:'.08em',fontWeight:600,display:'block',marginBottom:8}}>Bio</label>
                <div style={{background:'var(--ink7)',borderRadius:10,padding:14,fontSize:13,color:'var(--ink1)',lineHeight:1.65}}>{client.bio}</div>
              </div>
              {/* Brand Voice */}
              <div style={{gridColumn:'1/-1'}}>
                <label style={{fontSize:10.5,color:'var(--ink3)',textTransform:'uppercase',letterSpacing:'.08em',fontWeight:600,display:'block',marginBottom:8}}>Brand Voice <span style={{color:'var(--ink5)',fontWeight:400,textTransform:'none',fontSize:10}}>— editable, syncs to Notion</span></label>
                <textarea value={editVoice} onChange={e=>setEditVoice(e.target.value)} className="input" style={{width:'100%',minHeight:80,resize:'vertical',lineHeight:1.65,fontSize:13}}/>
              </div>
              {/* Audience */}
              <div style={{gridColumn:'1/-1'}}>
                <label style={{fontSize:10.5,color:'var(--ink3)',textTransform:'uppercase',letterSpacing:'.08em',fontWeight:600,display:'block',marginBottom:8}}>Target Audience</label>
                <textarea value={editAudience} onChange={e=>setEditAudience(e.target.value)} className="input" style={{width:'100%',minHeight:60,resize:'vertical',lineHeight:1.65,fontSize:13}}/>
              </div>
              {/* Do's */}
              <div>
                <label style={{fontSize:10.5,color:'var(--ink3)',textTransform:'uppercase',letterSpacing:'.08em',fontWeight:600,display:'block',marginBottom:8}}>Do's</label>
                <div style={{background:'var(--ink7)',borderRadius:10,padding:14,display:'flex',flexDirection:'column',gap:8}}>
                  {client.dos.map((d,i)=><div key={i} style={{fontSize:12,color:'var(--ink1)',display:'flex',gap:8,lineHeight:1.5}}><span style={{color:'var(--grn)',flexShrink:0,marginTop:1}}>✓</span>{d}</div>)}
                </div>
              </div>
              {/* Don'ts */}
              <div>
                <label style={{fontSize:10.5,color:'var(--ink3)',textTransform:'uppercase',letterSpacing:'.08em',fontWeight:600,display:'block',marginBottom:8}}>Don'ts</label>
                <div style={{background:'var(--ink7)',borderRadius:10,padding:14,display:'flex',flexDirection:'column',gap:8}}>
                  {client.donts.map((d,i)=><div key={i} style={{fontSize:12,color:'var(--ink1)',display:'flex',gap:8,lineHeight:1.5}}><span style={{color:'var(--red)',flexShrink:0,marginTop:1}}>✕</span>{d}</div>)}
                </div>
              </div>
              {/* Brand colors */}
              <div>
                <label style={{fontSize:10.5,color:'var(--ink3)',textTransform:'uppercase',letterSpacing:'.08em',fontWeight:600,display:'block',marginBottom:8}}>Brand Colors</label>
                <div style={{display:'flex',gap:8}}>
                  {client.brandColors.map((col,i)=>(
                    <div key={i} title={col} style={{width:40,height:40,borderRadius:8,background:col,border:'1px solid rgba(255,255,255,.08)',cursor:'pointer',transition:'transform .1s'}} onMouseOver={e=>e.currentTarget.style.transform='scale(1.1)'} onMouseOut={e=>e.currentTarget.style.transform='scale(1)'}/>
                  ))}
                </div>
              </div>
              {/* Notion link */}
              <div>
                <label style={{fontSize:10.5,color:'var(--ink3)',textTransform:'uppercase',letterSpacing:'.08em',fontWeight:600,display:'block',marginBottom:8}}>Notion Page</label>
                <div style={{background:'var(--ink7)',borderRadius:10,padding:'10px 14px',display:'flex',alignItems:'center',gap:8,fontSize:12.5}}>
                  <span style={{color:'var(--ink3)'}}>📄</span>
                  <span style={{color:'var(--ink1)'}}>{client.name}</span>
                  <span style={{marginLeft:'auto',fontSize:10.5,color:'var(--acc)',cursor:'pointer'}}>Open →</span>
                </div>
              </div>
            </div>
            <div style={{paddingTop:4}}>
              <button onClick={saveVoice} className="btn" style={{background:voiceSaved?'rgba(34,197,139,.15)':'var(--acc)',color:voiceSaved?'var(--grn)':'#fff',border:voiceSaved?'1px solid rgba(34,197,139,.3)':'none',transition:'all .3s',minWidth:140}}>
                {voiceSaved?'✓ Saved to Notion':'Save Changes'}
              </button>
            </div>
          </div>
        )}

        {tab==='content'&&(
          <div className="fadeIn">
            <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:16,flexWrap:'wrap'}}>
              {['all',...client.platforms].map(p=>(
                <button key={p} onClick={()=>setPlatFilter(p)} style={{padding:'5px 12px',borderRadius:20,fontSize:11.5,fontWeight:500,border:`1px solid ${platFilter===p?PLAT[p]?.color||'var(--acc)':'var(--ink6)'}`,background:platFilter===p?`${PLAT[p]?.color||'var(--acc)'}18`:'transparent',color:platFilter===p?PLAT[p]?.color||'var(--acc)':'var(--ink3)',cursor:'pointer',transition:'all .15s'}}>
                  {p==='all'?'All Platforms':PLAT[p]?.icon+' '+PLAT[p]?.label}
                </button>
              ))}
              <span style={{marginLeft:'auto',fontSize:11,color:'var(--ink3)'}}>{filtered.length} scraped posts</span>
            </div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(220px,1fr))',gap:12}}>
              {filtered.map(p=>(
                <div key={p.id} style={{background:'var(--ink7)',borderRadius:12,overflow:'hidden',border:'1px solid var(--ink6)',transition:'all .15s',cursor:'pointer'}} onMouseOver={e=>{e.currentTarget.style.borderColor='var(--ink5)';e.currentTarget.style.transform='translateY(-1px)'}} onMouseOut={e=>{e.currentTarget.style.borderColor='var(--ink6)';e.currentTarget.style.transform='translateY(0)'}}>
                  <div style={{height:90,background:p.type==='video'?'#0a0a0f':'#1a1e2a',display:'flex',alignItems:'center',justifyContent:'center',position:'relative'}}>
                    <span style={{fontSize:28,opacity:.6}}>{p.type==='video'?'▶':'🖼'}</span>
                    <span style={{position:'absolute',top:6,left:6}}><PlatTag platform={p.platform} size="xs"/></span>
                    {p.type==='video'&&<div style={{position:'absolute',inset:0,background:'linear-gradient(to top,rgba(0,0,0,.4),transparent)'}}/>}
                  </div>
                  <div style={{padding:'10px 12px'}}>
                    <div style={{fontSize:11.5,color:'var(--ink1)',lineHeight:1.5,marginBottom:8,display:'-webkit-box',WebkitLineClamp:2,WebkitBoxOrient:'vertical',overflow:'hidden'}}>{p.caption}</div>
                    <div style={{display:'flex',alignItems:'center',gap:10,fontSize:11,color:'var(--ink3)'}}>
                      <span>♥ {fmtNum(p.likes)}</span>
                      <span>💬 {fmtNum(p.comments)}</span>
                      <span style={{marginLeft:'auto',opacity:.7}}>{p.date}</span>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}

        {tab==='assets'&&(
          <div style={{display:'grid',gridTemplateColumns:'160px 1fr',gap:16,height:'calc(100% - 20px)'}} className="fadeIn">
            <div style={{background:'var(--ink7)',borderRadius:12,padding:10,height:'fit-content'}}>
              <div style={{fontSize:10,color:'var(--ink3)',fontWeight:600,textTransform:'uppercase',letterSpacing:'.07em',padding:'2px 4px 8px'}}>Folders</div>
              {folders.map(f=>(
                <button key={f} onClick={()=>setActiveFolder(f)} style={{width:'100%',textAlign:'left',padding:'7px 10px',borderRadius:7,fontSize:12,border:'none',background:folder===f?'var(--acc)18':'transparent',color:folder===f?'var(--acc)':'var(--ink2)',cursor:'pointer',transition:'all .12s',display:'flex',alignItems:'center',gap:6}}>
                  <span style={{fontSize:13}}>📁</span>{f}
                </button>
              ))}
            </div>
            <div>
              <div style={{fontSize:12,color:'var(--ink3)',marginBottom:12}}>{folder} · {folderAssets.length} files</div>
              <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(140px,1fr))',gap:10,marginBottom:14}}>
                {folderAssets.map(a=>(
                  <div key={a.id} onClick={()=>setSelectedAsset(selectedAsset?.id===a.id?null:a)} style={{background:'var(--ink7)',borderRadius:10,overflow:'hidden',border:`1px solid ${selectedAsset?.id===a.id?'var(--acc)':'var(--ink6)'}`,cursor:'pointer',transition:'all .15s'}}>
                    <div style={{height:80,background:a.color+'22',display:'flex',alignItems:'center',justifyContent:'center',fontSize:22}}>
                      {a.type==='video'?'🎬':'🖼'}

// ═══ CONTENT CALENDAR ════════════════════════════════════════════
function ContentCalendar({posts,clients,onCompose,setSelectedPost}){
  const today=new Date();
  const[calYear,setCalYear]=useState(today.getFullYear());
  const[calMonth,setCalMonth]=useState(today.getMonth());
  const[calView,setCalView]=useState('month');
  const[hoveredPost,setHoveredPost]=useState(null);
  const monthNames=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const dayNames=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

  function buildMonth(year,month){
    const first=new Date(year,month,1).getDay();
    const days=new Date(year,month+1,0).getDate();
    const cells=[];
    for(let i=0;i<first;i++)cells.push(null);
    for(let d=1;d<=days;d++)cells.push(d);
    while(cells.length%7!==0)cells.push(null);
    return cells;
  }

  const cells=buildMonth(calYear,calMonth);
  const isToday=d=>d&&calYear===today.getFullYear()&&calMonth===today.getMonth()&&d===today.getDate();
  function prevMonth(){if(calMonth===0){setCalYear(y=>y-1);setCalMonth(11);}else setCalMonth(m=>m-1);}
  function nextMonth(){if(calMonth===11){setCalYear(y=>y+1);setCalMonth(0);}else setCalMonth(m=>m+1);}

  const weekStart=new Date(today);weekStart.setDate(today.getDate()-today.getDay());
  const weekDays=Array.from({length:7},(_,i)=>{const d=new Date(weekStart);d.setDate(weekStart.getDate()+i);return d;});

  function getDayPosts(year,month,day){
    return posts.filter(p=>{const d=new Date(p.scheduledAt);return d.getFullYear()===year&&d.getMonth()===month&&d.getDate()===day;});
  }

  const scheduled=posts.filter(p=>['scheduled','approved'].includes(p.status)).length;

  return(
    <div style={{padding:'24px 28px',overflowY:'auto',height:'100%'}} className="slideLeft">
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:20}}>
        <div>
          <h1 style={{fontFamily:"'Fraunces',Georgia,serif",fontSize:24,fontWeight:400,color:'var(--fg)',letterSpacing:'-.02em'}}>{monthNames[calMonth]} {calYear}</h1>
          <p style={{fontSize:12,color:'var(--ink3)',marginTop:2}}>{scheduled} posts scheduled · {posts.filter(p=>p.status==='pending_review').length} awaiting review</p>
        </div>
        <div style={{display:'flex',gap:8,alignItems:'center'}}>
          <div style={{display:'flex',background:'var(--ink7)',borderRadius:8,padding:3}}>
            {['month','week'].map(v=>(
              <button key={v} onClick={()=>setCalView(v)} style={{padding:'5px 14px',borderRadius:6,fontSize:12,fontWeight:500,border:'none',background:calView===v?'var(--acc)':'transparent',color:calView===v?'#fff':'var(--ink3)',cursor:'pointer',transition:'all .15s'}}>
                {v.charAt(0).toUpperCase()+v.slice(1)}
              </button>
            ))}
          </div>
          <div style={{display:'flex',gap:4}}>
            <button onClick={prevMonth} className="btn btn-subtle" style={{padding:'7px 10px'}}>‹</button>
            <button onClick={()=>{setCalYear(today.getFullYear());setCalMonth(today.getMonth());}} className="btn btn-subtle" style={{padding:'7px 12px',fontSize:11.5}}>Today</button>
            <button onClick={nextMonth} className="btn btn-subtle" style={{padding:'7px 10px'}}>›</button>
          </div>
          <button onClick={()=>onCompose(null)} className="btn btn-acc">+ New Post</button>
        </div>
      </div>

      {/* Client legend */}
      <div style={{display:'flex',gap:10,marginBottom:16,flexWrap:'wrap'}}>
        {clients.map(c=>(
          <div key={c.id} style={{display:'flex',alignItems:'center',gap:5,fontSize:11,color:'var(--ink2)'}}>
            <div style={{width:8,height:8,borderRadius:2,background:c.color,flexShrink:0}}/>
            {c.name}
          </div>
        ))}
      </div>

      {/* Calendar grid */}
      <div style={{background:'var(--ink8)',border:'1px solid var(--ink7)',borderRadius:14,overflow:'hidden'}}>
        {/* Day headers */}
        <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',borderBottom:'1px solid var(--ink7)'}}>
          {dayNames.map(d=>(
            <div key={d} style={{padding:'10px 0',textAlign:'center',fontSize:11,color:'var(--ink3)',fontWeight:600,letterSpacing:'.04em'}}>{d}</div>
          ))}
        </div>
        {/* Cells */}
        {calView==='month'&&(
          <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)'}}>
            {cells.map((day,i)=>{
              const dayPosts=day?getDayPosts(calYear,calMonth,day):[];
              return(
                <div key={i} className="cal-cell" style={{borderRight:i%7!==6?'1px solid var(--ink7)':'none',borderBottom:i<cells.length-7?'1px solid var(--ink7)':'none',background:isToday(day)?'rgba(217,107,58,.06)':'transparent'}}>
                  {day&&(
                    <>
                      <div style={{fontSize:12,fontWeight:isToday(day)?700:400,color:isToday(day)?'var(--acc)':'var(--ink3)',marginBottom:4,display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                        <span>{day}</span>
                        {isToday(day)&&<span style={{fontSize:8,background:'var(--acc)',color:'#fff',borderRadius:3,padding:'1px 4px',fontWeight:700}}>TODAY</span>}
                      </div>
                      {dayPosts.slice(0,3).map(p=>{
                        const c=clients.find(cl=>cl.id===p.clientId);
                        return(
                          <div key={p.id} onClick={()=>setSelectedPost(p)} className="cal-chip" style={{background:`${c?.color}22`,border:`1px solid ${c?.color}44`,color:c?.color,borderRadius:4}}>
                            {PLAT[p.platform]?.icon} {c?.initials}
                          </div>
                        );
                      })}
                      {dayPosts.length>3&&<div style={{fontSize:9,color:'var(--ink3)',marginTop:2}}>+{dayPosts.length-3} more</div>}
                    </>
                  )}
                </div>
              );
            })}
          </div>
        )}
        {calView==='week'&&(
          <div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',borderBottom:'1px solid var(--ink7)'}}>
              {weekDays.map((d,i)=>{
                const isT=d.getDate()===today.getDate()&&d.getMonth()===today.getMonth();
                return(
                  <div key={i} style={{padding:'14px 12px',borderRight:i<6?'1px solid var(--ink7)':'none',background:isT?'rgba(217,107,58,.06)':'transparent',textAlign:'center'}}>
                    <div style={{fontSize:10,color:'var(--ink3)',fontWeight:600,marginBottom:4}}>{dayNames[i]}</div>
                    <div style={{fontSize:20,fontWeight:700,color:isT?'var(--acc)':'var(--fg)'}}>{d.getDate()}</div>
                  </div>
                );
              })}
            </div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',minHeight:300}}>
              {weekDays.map((d,i)=>{
                const dayPosts=posts.filter(p=>{const pd=new Date(p.scheduledAt);return pd.getDate()===d.getDate()&&pd.getMonth()===d.getMonth();});
                return(
                  <div key={i} style={{padding:8,borderRight:i<6?'1px solid var(--ink7)':'none',display:'flex',flexDirection:'column',gap:6}}>
                    {dayPosts.map(p=>{
                      const c=clients.find(cl=>cl.id===p.clientId);
                      return(
                        <div key={p.id} onClick={()=>setSelectedPost(p)} style={{background:c?.color+'18',border:`1px solid ${c?.color}33`,borderRadius:8,padding:'8px 10px',cursor:'pointer',transition:'all .15s'}} onMouseOver={e=>e.currentTarget.style.opacity='.75'} onMouseOut={e=>e.currentTarget.style.opacity='1'}>
                          <div style={{fontSize:10,color:c?.color,fontWeight:600,marginBottom:3}}>{c?.name}</div>
                          <div style={{fontSize:10.5,color:'var(--ink1)',overflow:'hidden',textOverflow:'ellipsis',display:'-webkit-box',WebkitLineClamp:2,WebkitBoxOrient:'vertical',marginBottom:5,lineHeight:1.4}}>{p.caption}</div>
                          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                            <PlatTag platform={p.platform} size="xs"/>
                            <StatusTag status={p.status}/>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                );
              })}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

// ═══ APPROVALS ════════════════════════════════════════════════════
function ApprovalsQueue({posts,setPosts,clients,showToast,setSelectedPost}){
  const pending=posts.filter(p=>p.status==='pending_review');
  const [filter,setFilter]=useState('all');

  const filtered=filter==='all'?pending:pending.filter(p=>p.clientId===filter);

  function approve(id){
    setPosts(ps=>ps.map(p=>p.id===id?{...p,status:'approved'}:p));
    showToast('Post approved ✓');
  }
  function reject(id){
    setPosts(ps=>ps.map(p=>p.id===id?{...p,status:'draft'}:p));
    showToast('Sent back to draft');
  }

  return(
    <div style={{padding:'28px 32px',overflowY:'auto',height:'100%'}} className="slideLeft">
      <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',marginBottom:24}}>

        </div>
        {pending.length>0&&(
          <button onClick={()=>{pending.forEach(p=>approve(p.id));}} className="btn btn-grn">Approve All ({pending.length})</button>

      {/* Client filter */}
      {pending.length>0&&(
        <div style={{display:'flex',gap:6,marginBottom:20,flexWrap:'wrap'}}>
          <button onClick={()=>setFilter('all')} style={{padding:'5px 12px',borderRadius:20,fontSize:11.5,fontWeight:500,border:`1px solid ${filter==='all'?'var(--acc)':'var(--ink6)'}`,background:filter==='all'?'rgba(217,107,58,.12)':'transparent',color:filter==='all'?'var(--acc)':'var(--ink3)',cursor:'pointer',transition:'all .15s'}}>
            All ({pending.length})

                <div style={{width:7,height:7,borderRadius:'50%',background:c.color}}/>
                {c.name} ({n})

            );
          })}
        </div>
      )}

      {pending.length===0&&(
        <div style={{textAlign:'center',padding:'80px 20px',color:'var(--ink3)'}}>
          <div style={{fontSize:40,marginBottom:14}}>✓</div>
          <div style={{fontSize:15,fontWeight:500,color:'var(--ink2)',marginBottom:6}}>All clear!</div>
          <div style={{fontSize:12}}>No posts waiting for review right now.</div>
        </div>

      <div style={{display:'flex',flexDirection:'column',gap:10}}>
        {filtered.map(p=>{

            <div key={p.id} style={{background:'var(--ink8)',border:'1px solid var(--ink7)',borderRadius:14,padding:18,transition:'all .15s',cursor:'pointer'}} onClick={()=>setSelectedPost(p)} onMouseOver={e=>e.currentTarget.style.borderColor='var(--ink5)'} onMouseOut={e=>e.currentTarget.style.borderColor='var(--ink7)'}>
              <div style={{display:'flex',alignItems:'flex-start',gap:12}}>
                {c&&<Avatar client={c} size={36}/>}
                <div style={{flex:1,minWidth:0}}>
                  <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:6}}>

                    <span style={{marginLeft:'auto',fontSize:11,color:'var(--ink3)'}}>{fmtDate(p.scheduledAt)} · {fmtTime(p.scheduledAt)}</span>
                  </div>
                  <div style={{fontSize:13,color:'var(--ink1)',lineHeight:1.6,marginBottom:6,display:'-webkit-box',WebkitLineClamp:3,WebkitBoxOrient:'vertical',overflow:'hidden'}}>{p.caption}</div>

// ═══ POST COMPOSER ════════════════════════════════════════════════
function PostComposer({open,onClose,clients,initialClient,onSave,showToast}){
  const[client,setClient]=useState(initialClient||null);
  const[platforms,setPlatforms]=useState(['instagram']);
  const[caption,setCaption]=useState('');
  const[hashtags,setHashtags]=useState('');
  const[scheduleAt,setScheduleAt]=useState('');
  const[aiLoading,setAiLoading]=useState(false);
  const[aiVariants,setAiVariants]=useState([]);
  const[previewPlat,setPreviewPlat]=useState('instagram');
  const[saving,setSaving]=useState('');

  useEffect(()=>{if(open&&initialClient)setClient(initialClient);},[open,initialClient]);
  useEffect(()=>{if(open){setCaption('');setHashtags('');setAiVariants([]);setPlatforms(['instagram']);setSaving('');}},[open]);

  function togglePlat(p){setPlatforms(prev=>prev.includes(p)?prev.filter(x=>x!==p):[...prev,p]);}

  async function generateAI(){
    if(!client)return showToast('Select a client first');
    setAiLoading(true);setAiVariants([]);
    await new Promise(r=>setTimeout(r,1600));
    const pool=AI_RESPONSES[client.id]||AI_RESPONSES.c1;
    setAiVariants(pool);
    setAiLoading(false);
  }

  function applyVariant(v){
    const parts=v.split('\n\n');
    const tags=parts.find(p=>p.startsWith('#'));
    setCaption(parts[0].replace(/^"|"$/g,'').replace(/\\n/g,'\n'));
    if(tags)setHashtags(tags);
    showToast('Caption applied');
  }

  function handleSave(status){
    if(!client)return showToast('Select a client first');
    if(!caption.trim())return showToast('Caption is empty');
    setSaving(status);
    setTimeout(()=>{
      onSave({id:'p'+Date.now(),clientId:client.id,platform:platforms[0]||'instagram',caption,hashtags,status,scheduledAt:scheduleAt||new Date(Date.now()+86400000).toISOString(),aiGenerated:aiVariants.length>0});
      setSaving('');
      onClose();
      showToast(status==='pending_review'?'Submitted for review':'Draft saved');
    },900);
  }

  if(!open)return null;

  const charLimit=PLAT[previewPlat]?.limit||2200;
  const charCount=caption.length+(hashtags?hashtags.length+2:0);
  const charPct=Math.min(1,charCount/charLimit);
  const charColor=charPct>.9?'var(--red)':charPct>.7?'var(--amb)':'var(--grn)';

  return(
    <div style={{position:'fixed',inset:0,zIndex:200,display:'flex',alignItems:'stretch',justifyContent:'flex-end'}} className="fadeIn">
      <div style={{position:'absolute',inset:0,background:'rgba(0,0,0,.6)',backdropFilter:'blur(4px)'}} onClick={onClose}/>
      <div style={{position:'relative',width:760,background:'var(--ink8)',borderLeft:'1px solid var(--ink7)',display:'flex',flexDirection:'column',height:'100%',overflowY:'auto'}} className="slideRight">
        {/* Header */}
        <div style={{padding:'18px 22px',borderBottom:'1px solid var(--ink7)',display:'flex',alignItems:'center',gap:12,flexShrink:0}}>
          <div style={{flex:1}}>
            <div style={{fontFamily:"'Fraunces',Georgia,serif",fontSize:18,fontWeight:400,color:'var(--fg)',letterSpacing:'-.01em'}}>New Post</div>
            <div style={{fontSize:11,color:'var(--ink3)',marginTop:2}}>Create and schedule content across platforms</div>
          </div>
          <button onClick={onClose} style={{background:'var(--ink7)',border:'none',color:'var(--ink2)',borderRadius:8,width:32,height:32,display:'grid',placeItems:'center',cursor:'pointer',fontSize:16}}>✕</button>
        </div>

        <div style={{display:'grid',gridTemplateColumns:'1fr 260px',flex:1,overflow:'hidden'}}>
          {/* Left: form */}
          <div style={{padding:'20px 22px',overflowY:'auto',display:'flex',flexDirection:'column',gap:18,borderRight:'1px solid var(--ink7)'}}>
            {/* Client picker */}
            <div>
              <label style={{fontSize:11,color:'var(--ink3)',fontWeight:600,textTransform:'uppercase',letterSpacing:'.07em',display:'block',marginBottom:8}}>Client</label>
              <div style={{display:'grid',gridTemplateColumns:'repeat(2,1fr)',gap:6}}>
                {clients.map(c=>(
                  <button key={c.id} onClick={()=>setClient(c)} style={{display:'flex',alignItems:'center',gap:8,padding:'8px 10px',borderRadius:9,border:`1px solid ${client?.id===c.id?c.color:'var(--ink6)'}`,background:client?.id===c.id?c.color+'14':'transparent',cursor:'pointer',transition:'all .15s',textAlign:'left'}}>
                    <div style={{width:24,height:24,borderRadius:6,background:c.color,display:'grid',placeItems:'center',fontSize:9,fontWeight:700,color:'#fff',flexShrink:0}}>{c.initials}</div>
                    <div>
                      <div style={{fontSize:12,fontWeight:600,color:'var(--fg)',lineHeight:1.2}}>{c.name}</div>
                      <div style={{fontSize:10,color:'var(--ink3)'}}>{c.genre}</div>
                    </div>
                  </button>
                ))}
              </div>
            </div>

            {/* Platform toggles */}
            <div>
              <label style={{fontSize:11,color:'var(--ink3)',fontWeight:600,textTransform:'uppercase',letterSpacing:'.07em',display:'block',marginBottom:8}}>Platforms</label>
              <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
                {(client?client.platforms:Object.keys(PLAT)).map(p=>{
                  const on=platforms.includes(p);
                  const pl=PLAT[p];
                  return(
                    <button key={p} onClick={()=>togglePlat(p)} style={{padding:'6px 12px',borderRadius:20,fontSize:12,fontWeight:600,border:`1px solid ${on?pl.color:'var(--ink6)'}`,background:on?pl.color+'18':'transparent',color:on?pl.color:'var(--ink3)',cursor:'pointer',transition:'all .15s'}}>
                      {pl.icon} {pl.label}
                    </button>
                  );
                })}
              </div>
            </div>

            {/* Caption */}
            <div>
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8}}>
                <label style={{fontSize:11,color:'var(--ink3)',fontWeight:600,textTransform:'uppercase',letterSpacing:'.07em'}}>Caption</label>
                <span style={{fontSize:10.5,color:charColor,fontWeight:600}}>{charCount}/{charLimit}</span>
              </div>
              <textarea value={caption} onChange={e=>setCaption(e.target.value)} className="input" placeholder="Write your caption…" style={{width:'100%',minHeight:130,resize:'vertical',lineHeight:1.65,fontSize:13}}/>
              {/* char bar */}
              <div style={{height:2,borderRadius:2,background:'var(--ink6)',marginTop:6}}>
                <div style={{height:'100%',borderRadius:2,background:charColor,width:`${charPct*100}%`,transition:'width .2s,background .2s'}}/>
              </div>
            </div>

            {/* Hashtags */}
            <div>
              <label style={{fontSize:11,color:'var(--ink3)',fontWeight:600,textTransform:'uppercase',letterSpacing:'.07em',display:'block',marginBottom:8}}>Hashtags</label>
              <textarea value={hashtags} onChange={e=>setHashtags(e.target.value)} className="input" placeholder="#hashtag1 #hashtag2…" style={{width:'100%',minHeight:60,resize:'vertical',fontSize:12.5,lineHeight:1.6}}/>
            </div>

            {/* AI Generate */}
            <div style={{background:'var(--ink7)',borderRadius:12,padding:14}}>
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:aiVariants.length?12:0}}>
                <div>
                  <div style={{fontSize:12.5,fontWeight:600,color:'var(--fg)',display:'flex',alignItems:'center',gap:6}}>
                    <span style={{color:'var(--pur)'}}>✦</span> AI Caption Generator
                  </div>
                  <div style={{fontSize:11,color:'var(--ink3)',marginTop:2}}>Brand-matched captions using {client?.name||'your client'}'s voice</div>
                </div>
                <button onClick={generateAI} className="btn" style={{background:'linear-gradient(135deg,var(--pur),#6b3fd4)',color:'#fff',border:'none',flexShrink:0}} disabled={aiLoading}>
                  {aiLoading?<><Spinner size={12}/> Generating…</>:'Generate ✦'}
                </button>
              </div>
              {aiVariants.length>0&&(
                <div style={{display:'flex',flexDirection:'column',gap:8}} className="fadeUp">
                  {aiVariants.map((v,i)=>(
                    <div key={i} style={{background:'var(--ink8)',borderRadius:9,padding:'10px 12px',border:'1px solid var(--ink6)',cursor:'pointer',transition:'all .15s'}} onClick={()=>applyVariant(v)} onMouseOver={e=>e.currentTarget.style.borderColor='var(--pur)'} onMouseOut={e=>e.currentTarget.style.borderColor='var(--ink6)'}>
                      <div style={{fontSize:11.5,color:'var(--ink1)',lineHeight:1.55,marginBottom:6,whiteSpace:'pre-wrap',display:'-webkit-box',WebkitLineClamp:3,WebkitBoxOrient:'vertical',overflow:'hidden'}}>{v}</div>
                      <div style={{fontSize:10,color:'var(--pur)',fontWeight:600}}>Click to apply →</div>
                    </div>
                  ))}
                </div>
              )}
            </div>

            {/* Schedule */}
            <div>
              <label style={{fontSize:11,color:'var(--ink3)',fontWeight:600,textTransform:'uppercase',letterSpacing:'.07em',display:'block',marginBottom:8}}>Schedule Date & Time</label>
              <input type="datetime-local" value={scheduleAt} onChange={e=>setScheduleAt(e.target.value)} className="input" style={{width:'100%',colorScheme:'dark'}}/>
            </div>

            {/* Actions */}
            <div style={{display:'flex',gap:8,paddingTop:4}}>
              <button onClick={()=>handleSave('draft')} className="btn btn-ghost" disabled={!!saving}>
                {saving==='draft'?<><Spinner size={12}/> Saving…</>:'Save Draft'}
              </button>
              <button onClick={()=>handleSave('pending_review')} className="btn btn-acc" style={{flex:1,justifyContent:'center'}} disabled={!!saving}>
                {saving==='pending_review'?<><Spinner size={12}/> Submitting…</>:'Submit for Review'}
              </button>
            </div>
          </div>

          {/* Right: preview */}
          <div style={{padding:'20px 16px',overflowY:'auto',background:'var(--ink9)',display:'flex',flexDirection:'column',gap:12}}>
            <div>
              <label style={{fontSize:10.5,color:'var(--ink3)',fontWeight:600,textTransform:'uppercase',letterSpacing:'.07em',display:'block',marginBottom:8}}>Preview</label>
              <div style={{display:'flex',gap:4}}>
                {platforms.map(p=>(
                  <button key={p} onClick={()=>setPreviewPlat(p)} style={{padding:'4px 10px',borderRadius:12,fontSize:11,fontWeight:600,border:`1px solid ${previewPlat===p?PLAT[p].color:'var(--ink6)'}`,background:previewPlat===p?PLAT[p].color+'18':'transparent',color:previewPlat===p?PLAT[p].color:'var(--ink3)',cursor:'pointer'}}>
                    {PLAT[p].icon}
                  </button>
                ))}
              </div>
            </div>
            {/* Mock phone preview */}
            <div style={{background:'#000',borderRadius:20,overflow:'hidden',border:'2px solid var(--ink6)',aspectRatio:'9/16',maxHeight:420,display:'flex',flexDirection:'column'}}>
              {/* Post header */}
              <div style={{padding:'10px 12px',display:'flex',alignItems:'center',gap:8,background:'#111'}}>
                {client&&<div style={{width:26,height:26,borderRadius:'50%',background:client.color,display:'grid',placeItems:'center',fontSize:9,fontWeight:700,color:'#fff'}}>{client.initials}</div>}
                <div>
                  <div style={{fontSize:11,fontWeight:600,color:'#fff'}}>{client?.handles?.[previewPlat]||'@handle'}</div>
                  <div style={{fontSize:9,color:'#888'}}>Sponsored · {previewPlat}</div>
                </div>
                <span style={{marginLeft:'auto',color:'#888',fontSize:16}}>···</span>
              </div>
              {/* Image placeholder */}
              <div style={{flex:1,background:client?`linear-gradient(135deg,${client.color}44,${client.color}11,#000)`:'var(--ink7)',display:'flex',alignItems:'center',justifyContent:'center'}}>
                {client?<div style={{width:64,height:64,borderRadius:'50%',background:client.color,display:'grid',placeItems:'center',fontSize:20,fontWeight:700,color:'#fff',opacity:.7}}>{client.initials}</div>:<span style={{color:'var(--ink5)',fontSize:12}}>Select a client</span>}
              </div>
              {/* Caption */}
              <div style={{padding:'8px 12px',background:'#111'}}>
                <div style={{fontSize:10,color:'#fff',lineHeight:1.5,display:'-webkit-box',WebkitLineClamp:2,WebkitBoxOrient:'vertical',overflow:'hidden'}}>{caption||<span style={{color:'#555'}}>Caption will appear here…</span>}</div>
                {hashtags&&<div style={{fontSize:9,color:'#4d9fff',marginTop:3,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{hashtags}</div>}
              </div>
            </div>
            {/* Char counter for preview plat */}
            <div style={{fontSize:11,color:charColor,textAlign:'center',fontWeight:600}}>
              {charLimit-charCount} characters remaining for {PLAT[previewPlat]?.label}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

// ═══ ONBOARDING WIZARD ═══════════════════════════════════════════
function OnboardingWizard({open,onClose,onComplete,showToast}){
  const[step,setStep]=useState(0);
  const[name,setName]=useState('');
  const[genre,setGenre]=useState('');
  const[handles,setHandles]=useState({instagram:'',tiktok:''});
  const[driveConnected,setDriveConnected]=useState(false);
  const[driveLoading,setDriveLoading]=useState(false);
  const[scraping,setScraping]=useState(false);
  const[scrapeProgress,setScrapeProgress]=useState(0);
  const[scraped,setScraped]=useState([]);

  function connectDrive(){
    setDriveLoading(true);
    setTimeout(()=>{setDriveLoading(false);setDriveConnected(true);showToast('Google Drive connected');},1800);
  }

  function startScrape(){
    setScraping(true);setScrapeProgress(0);
    const interval=setInterval(()=>{
      setScrapeProgress(p=>{
        if(p>=100){clearInterval(interval);setScraping(false);setScraped([{platform:'instagram',caption:'Latest content from the account',likes:1240,type:'image'},{platform:'instagram',caption:'A recent post about their work',likes:890,type:'image'},{platform:'tiktok',caption:'Trending video content',likes:5600,type:'video'}]);return 100;}
        return p+2;
      });
    },64);
  }

  function complete(){
    const initials=name.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
    const colors=['#d96b3a','#9b6dff','#f5a623','#22c58b','#4d9fff','#f25c5c'];
    const color=colors[Math.floor(Math.random()*colors.length)];
    onComplete({id:'c'+Date.now(),name,genre,initials,color,handles,platforms:Object.keys(handles).filter(k=>handles[k]),postsThisWeek:0,pendingApproval:0,lastSynced:new Date().toISOString(),bio:'',brandVoice:'',targetAudience:'',dos:[],donts:[],brandColors:[color],followers:{instagram:'0',tiktok:'0'}});
    onClose();
    showToast(`${name} added to your roster!`);
  }

  if(!open)return null;

  const steps=['Client Info','Google Drive','Scrape Content','Review'];
  const canNext=[name.trim()&&genre.trim(),driveConnected,scrapeProgress===100,true];

  return(
    <div style={{position:'fixed',inset:0,zIndex:300,display:'flex',alignItems:'center',justifyContent:'center',padding:24}} className="fadeIn">
      <div style={{position:'absolute',inset:0,background:'rgba(0,0,0,.75)',backdropFilter:'blur(6px)'}} onClick={onClose}/>
      <div style={{position:'relative',width:'100%',maxWidth:560,background:'var(--ink8)',border:'1px solid var(--ink7)',borderRadius:20,overflow:'hidden',boxShadow:'0 24px 80px rgba(0,0,0,.6)'}} className="scaleIn">
        {/* Progress header */}
        <div style={{padding:'20px 24px',borderBottom:'1px solid var(--ink7)'}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:14}}>
            <div style={{fontFamily:"'Fraunces',Georgia,serif",fontSize:18,fontWeight:400,color:'var(--fg)'}}>Add New Client</div>
            <button onClick={onClose} style={{background:'none',border:'none',color:'var(--ink3)',fontSize:20,cursor:'pointer',lineHeight:1}}>✕</button>
          </div>
          {/* Step indicators */}
          <div style={{display:'flex',gap:0,alignItems:'center'}}>
            {steps.map((s,i)=>(
              <React.Fragment key={i}>
                <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:4}}>
                  <div style={{width:28,height:28,borderRadius:'50%',background:i<step?'var(--grn)':i===step?'var(--acc)':'var(--ink6)',display:'grid',placeItems:'center',fontSize:11,fontWeight:700,color:i<=step?'#fff':'var(--ink3)',transition:'all .3s'}}>
                    {i<step?'✓':i+1}
                  </div>
                  <div style={{fontSize:9.5,color:i===step?'var(--fg)':'var(--ink3)',fontWeight:i===step?600:400,whiteSpace:'nowrap'}}>{s}</div>
                </div>
                {i<steps.length-1&&<div style={{flex:1,height:1,background:i<step?'var(--grn)':'var(--ink6)',margin:'0 6px 14px',transition:'background .4s'}}/>}
              </React.Fragment>
            ))}
          </div>
        </div>
        {/* Step content */}
        <div style={{padding:24,minHeight:260}}>
          {step===0&&(
            <div style={{display:'flex',flexDirection:'column',gap:14}} className="fadeIn">
              <div><label style={{fontSize:11,color:'var(--ink3)',fontWeight:600,textTransform:'uppercase',letterSpacing:'.07em',display:'block',marginBottom:6}}>Client Name *</label>
              <input value={name} onChange={e=>setName(e.target.value)} className="input" style={{width:'100%'}} placeholder="e.g. Maya Soleil"/></div>
              <div><label style={{fontSize:11,color:'var(--ink3)',fontWeight:600,textTransform:'uppercase',letterSpacing:'.07em',display:'block',marginBottom:6}}>Genre / Category *</label>
              <input value={genre} onChange={e=>setGenre(e.target.value)} className="input" style={{width:'100%'}} placeholder="e.g. R&B / Soul, Food & Beverage…"/></div>
              <div style={{background:'var(--ink7)',borderRadius:10,padding:12,fontSize:12,color:'var(--ink2)',lineHeight:1.6}}>
                ✦ We'll auto-create a Notion page and Google Drive folder for <strong style={{color:'var(--fg)'}}>{name||'this client'}</strong> after you finish setup.
              </div>
            </div>
          )}
          {step===1&&(
            <div style={{display:'flex',flexDirection:'column',gap:14,alignItems:'center',textAlign:'center',paddingTop:10}} className="fadeIn">
              <div style={{width:60,height:60,borderRadius:16,background:'rgba(77,159,255,.12)',border:'1px solid rgba(77,159,255,.25)',display:'grid',placeItems:'center',fontSize:28}}>📁</div>
              <div>
                <div style={{fontSize:15,fontWeight:600,color:'var(--fg)',marginBottom:6}}>Connect Google Drive</div>
                <div style={{fontSize:12,color:'var(--ink2)',lineHeight:1.6}}>We'll create a shared folder for <strong style={{color:'var(--fg)'}}>{name||'this client'}</strong> inside your agency's Drive. All assets will live there.</div>
              </div>
              {!driveConnected?(
                <button onClick={connectDrive} className="btn" style={{background:'#4f87f5',color:'#fff',border:'none',padding:'10px 24px',fontSize:13}} disabled={driveLoading}>
                  {driveLoading?<><Spinner size={13}/> Connecting…</>:'🔐 Connect Google Drive'}
                </button>
              ):(
                <div style={{background:'rgba(34,197,139,.1)',border:'1px solid rgba(34,197,139,.25)',borderRadius:10,padding:'10px 18px',fontSize:13,color:'var(--grn)',display:'flex',alignItems:'center',gap:8}} className="scaleIn">
                  ✓ Drive connected — folder created
                </div>
              )}
            </div>
          )}
          {step===2&&(
            <div style={{display:'flex',flexDirection:'column',gap:14}} className="fadeIn">
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
                <div><label style={{fontSize:11,color:'var(--ink3)',fontWeight:600,textTransform:'uppercase',letterSpacing:'.07em',display:'block',marginBottom:6}}>Instagram handle</label>
                <input value={handles.instagram} onChange={e=>setHandles(h=>({...h,instagram:e.target.value}))} className="input" style={{width:'100%'}} placeholder="@handle"/></div>
                <div><label style={{fontSize:11,color:'var(--ink3)',fontWeight:600,textTransform:'uppercase',letterSpacing:'.07em',display:'block',marginBottom:6}}>TikTok handle</label>
                <input value={handles.tiktok} onChange={e=>setHandles(h=>({...h,tiktok:e.target.value}))} className="input" style={{width:'100%'}} placeholder="@handle"/></div>
              </div>
              {!scraping&&scrapeProgress===0&&(
                <button onClick={startScrape} className="btn btn-acc" style={{alignSelf:'flex-start'}}>
                  Scrape Last 36 Posts
                </button>
              )}
              {(scraping||scrapeProgress>0)&&(
                <div style={{background:'var(--ink7)',borderRadius:10,padding:14}} className="fadeIn">
                  <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8}}>
                    <div style={{fontSize:12,fontWeight:600,color:'var(--fg)'}}>{scrapeProgress<100?'Scraping posts…':'Scrape complete!'}</div>
                    <div style={{fontSize:11,color:'var(--ink3)'}}>{Math.round(scrapeProgress)}%</div>
                  </div>
                  <div style={{height:4,borderRadius:2,background:'var(--ink6)',overflow:'hidden'}}>
                    <div style={{height:'100%',borderRadius:2,background:'var(--acc)',width:`${scrapeProgress}%`,transition:'width .1s linear'}}/>
                  </div>
                  {scrapeProgress===100&&scraped.length>0&&(
                    <div style={{marginTop:10,display:'flex',flexDirection:'column',gap:5}} className="fadeIn">
                      {scraped.slice(0,3).map((p,i)=>(
                        <div key={i} style={{display:'flex',alignItems:'center',gap:8,fontSize:11,color:'var(--ink1)'}}>
                          <span style={{color:'var(--grn)'}}>✓</span>{p.caption} <PlatTag platform={p.platform} size="xs"/>
                        </div>
                      ))}
                      <div style={{fontSize:11,color:'var(--grn)',marginTop:4}}>+ {36-scraped.length} more posts imported</div>
                    </div>
                  )}
                </div>
              )}
            </div>
          )}
          {step===3&&(
            <div style={{display:'flex',flexDirection:'column',gap:10}} className="fadeIn">
              <div style={{fontSize:13,color:'var(--ink2)',marginBottom:6}}>Here's what will be created for <strong style={{color:'var(--fg)'}}>{name}</strong>:</div>
              {[
                {icon:'📋',label:'Notion page with brand profile'},
                {icon:'📁',label:'Google Drive folder for assets'},
                {icon:'📷',label:`${scrapeProgress===100?36:0} scraped posts imported`},
                {icon:'🗄️',label:'Supabase record created'},
              ].map((item,i)=>(
                <div key={i} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 12px',background:'var(--ink7)',borderRadius:9,fontSize:12.5,color:'var(--ink1)'}}>
                  <span style={{fontSize:16}}>{item.icon}</span>{item.label}
                </div>
              ))}
            </div>
          )}
        </div>
        {/* Footer */}
        <div style={{padding:'16px 24px',borderTop:'1px solid var(--ink7)',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
          <button onClick={()=>step>0?setStep(s=>s-1):onClose()} className="btn btn-ghost">
            {step===0?'Cancel':'← Back'}
          </button>
          <button onClick={()=>step<steps.length-1?setStep(s=>s+1):complete()} className="btn btn-acc" disabled={!canNext[step]} style={{opacity:canNext[step]?1:.4}}>
            {step===steps.length-1?'Add Client':'Next →'}
          </button>
        </div>
      </div>
    </div>
  );
}

// ═══ APP ══════════════════════════════════════════════════════════
function App(){
  const[view,setView]=useState('roster');
  const[posts,setPosts]=useState(POSTS_INIT);
  const[clients,setClients]=useState(CLIENTS);
  const[activeClientId,setActiveClientId]=useState(null);
  const[selectedPost,setSelectedPost]=useState(null);
  const[showComposer,setShowComposer]=useState(false);
  const[composerClient,setComposerClient]=useState(null);
  const[showOnboarding,setShowOnboarding]=useState(false);
  const[toast,setToast]=useState(null);

  const showToast=useCallback(msg=>setToast(msg),[]);
  const activeClient=clients.find(c=>c.id===activeClientId)||null;

  function openComposer(client){setComposerClient(client||null);setShowComposer(true);}
  function handleAddClient(newClient){setClients(cs=>[...cs,newClient]);}
  function handleSavePost(post){setPosts(ps=>[...ps,post]);}
  function setActiveClient(id){setActiveClientId(id);}

  const mainContent=()=>{
    if(view==='client'&&activeClientId){
      const client=clients.find(c=>c.id===activeClientId);
      if(client)return(
        <ClientDetail key={activeClientId} client={client} posts={posts} onBack={()=>setView('roster')} onCompose={openComposer} showToast={showToast} setActiveClient={setActiveClient}/>
      );
    }
    if(view==='roster'||view==='client')return <ClientRoster clients={clients} posts={posts} onSelect={c=>{setActiveClientId(c.id);setView('client');}} onAddClient={()=>setShowOnboarding(true)}/>;
    if(view==='calendar')return <ContentCalendar posts={posts} clients={clients} onCompose={openComposer} setSelectedPost={p=>{setSelectedPost(p);}}/>;
    if(view==='approvals')return <ApprovalsQueue posts={posts} setPosts={setPosts} clients={clients} showToast={showToast} setSelectedPost={setSelectedPost}/>;
    if(view==='analytics')return <Analytics posts={posts} clients={clients}/>;
    if(view==='compose'){openComposer(null);setView('roster');return <ClientRoster clients={clients} posts={posts} onSelect={c=>{setActiveClientId(c.id);setView('client');}} onAddClient={()=>setShowOnboarding(true)}/>;}
    return null;
  };

  return(
    <div style={{display:'flex',height:'100vh',overflow:'hidden',background:'var(--ink9)'}}>
      <Sidebar view={view} setView={v=>{setView(v);if(v!=='client')setActiveClientId(null);}} activeClientId={activeClientId} setActiveClient={id=>{setActiveClientId(id);setView('client');}} clients={clients} posts={posts} onAddClient={()=>setShowOnboarding(true)}/>
      <main style={{flex:1,overflow:'hidden',display:'flex',flexDirection:'column'}}>
        {mainContent()}
      </main>
      <RightPanel activeClient={activeClient||composerClient} selectedPost={selectedPost} setSelectedPost={setSelectedPost} posts={posts} setPosts={setPosts} showToast={showToast} view={view}/>

      <PostComposer open={showComposer} onClose={()=>setShowComposer(false)} clients={clients} initialClient={composerClient} onSave={handleSavePost} showToast={showToast}/>
      <OnboardingWizard open={showOnboarding} onClose={()=>setShowOnboarding(false)} onComplete={handleAddClient} showToast={showToast}/>
      {toast&&<Toast msg={toast} onClose={()=>setToast(null)}/>}
    </div>
  );
}

const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
